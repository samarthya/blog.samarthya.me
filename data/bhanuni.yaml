# Bhanuni's Studio: one entry per drawing. Image: content/bhanuni/art/<id>.jpg
# New drawings: python -I tools/bhanuni/import_art.py <folder>  (adds entries with publish: false)
#
#   title        her title for it
#   date         when it was drawn (from the photo or file; fix it if wrong)
#   medium       digital | pencil | colour pencil | crayon | ink | paint | mixed
#   kind         original | fan-art
#   inspired_by  for fan art: the show, game or book it comes from
#   series       pictures that belong together share a series name (shown in order of date)
#   words        one line in her own words (shown under the picture)
#   featured     true: shown in the "favourites" row at the top
#   publish      true once she says it can go up; false keeps it off the site

