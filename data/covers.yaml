# Card covers for posts that have no image of their own.
# layouts/partials/functions/feature-image.html walks this list top to bottom and uses the
# first topic whose `match` shares a tag, category or title word with the post. `notes` is the fallback.
# Covers are generated by tools/covers/make_covers.py from the same file: edit, then re-run it.
topics:
  - { name: personal,   label: "Life",        glyph: "♥",     from: "#ec4899", to: "#831843", match: [personal, gallery, photos, life, fun] }
  - { name: agile,      label: "Agile",       glyph: "◎",     from: "#a855f7", to: "#4c1d95", match: [safe, agile, lean, scaledagile, businessagility] }
  - { name: security,   label: "Security",    glyph: "⛨",     from: "#ef4444", to: "#7f1d1d", match: [security, siem, cissp, cism, oauth, crypto, cipher, identity, openldap, realms] }
  - { name: elastic,    label: "Elastic",     glyph: "{ }",   from: "#14b8a6", to: "#134e4a", match: [elasticsearch, elastic, ilm, ecs, snapshot, analyze, query, alerting, painless, kibana, logstash, reindex] }
  - { name: kafka,      label: "Streams",     glyph: "≋",     from: "#64748b", to: "#0f172a", match: [kafka, streams, consumer] }
  - { name: devops,     label: "DevOps",      glyph: "∞",     from: "#6366f1", to: "#312e81", match: [spinnaker, devops, cd, pipeline, git, github, scm, postman, newman, artifacts, dns, cloudflare, ci] }
  - { name: kubernetes, label: "Kubernetes",  glyph: "⎈",     from: "#3b82f6", to: "#1e3a8a", match: [k8s, kubernetes, helm, helmv3, kubeadm, kubectl, pods, ingress, calico, cni, rbac, pv, pvc, configmap, taint, networkpolicy, metricserver, probes, deployments, cluster, network, controller, kubelet, node] }
  - { name: docker,     label: "Containers",  glyph: "▣",     from: "#0ea5e9", to: "#0c4a6e", match: [docker, container, registry, storage, volumes, multicontainer] }
  - { name: golang,     label: "Go",          glyph: "go",    from: "#06b6d4", to: "#155e75", match: [golang, go, channels, concurrency, exercism, race] }
  - { name: java,       label: "Java",        glyph: "☕",     from: "#f59e0b", to: "#9a3412", match: [java, java8, maven, junit, gradle, functional, flatmap, stream, lambda, spring] }
  - { name: linux,      label: "Linux",       glyph: "$_",    from: "#22c55e", to: "#14532d", match: [linux, ubuntu, bash, systemd, journalctl, zabbix, vbox, nginx, disk, awk, ansible, molecule, vagrant, shell, grep, sed] }
  - { name: web,        label: "Web & APIs",  glyph: "</>",   from: "#10b981", to: "#064e3b", match: [reactjs, webservice, rest, apis, ws, hugo, vue] }
  - { name: notes,      label: "Notes",       glyph: "✎",     from: "#f97316", to: "#7c2d12", match: [] }
