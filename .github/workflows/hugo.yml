# Build the Hugo site and deploy it to GitHub Pages on every push to main.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a deploy that's already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0 # keep in sync with mise.toml and Blowfish's supported range
      HUGO_ENVIRONMENT: production
      TZ: America/New_York
    steps:
      - name: Install Hugo extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout (with Blowfish submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so .Lastmod can come from git

      # Pushes go straight to main, so the privacy check must gate the deploy here too (validate.yml only
      # covers pull requests). Standard library only: no setup step needed.
      - name: Privacy check (secrets, local paths, image metadata)
        run: |
          python3 -m unittest discover -s tools/privacy
          python3 tools/privacy/check.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_url is https://samarthya.github.io/blog/ while testing, and becomes
      # https://samarthya.me/ automatically once the custom domain is set.
      - name: Build
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages can stay in "syncing_files" for over 10 minutes on larger publishes.
          # Avoid action-level timeout/cancel for otherwise healthy deploys.
          timeout: 1800000

  # Tell the portfolio (samarthya.github.io) to rebuild, so its "Latest Blog Posts" list picks up this deploy.
  # Its build reads https://samarthya.me/latest.json, which the CDN caches for up to 10 minutes, so wait until
  # the live file is newer than this deploy first. Needs the PORTFOLIO_DISPATCH_TOKEN secret: a fine-grained
  # token for samarthya/samarthya.github.io only, with "Contents: Read and write". Without it the job is skipped.
  notify-portfolio:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
    steps:
      - name: Wait for the new latest.json to be live
        if: env.TOKEN != ''
        run: |
          deployed=$(date -u +%s)
          for i in $(seq 1 30); do
            lm=$(curl -sI https://samarthya.me/latest.json | tr -d '\r' | sed -n 's/^[Ll]ast-[Mm]odified: //p')
            if [ -n "$lm" ] && [ "$(date -u -d "$lm" +%s)" -ge "$((deployed - 300))" ]; then
              echo "latest.json is live: $lm"; exit 0
            fi
            sleep 20
          done
          echo "::warning::latest.json still looked old after 10 minutes; asking the portfolio to rebuild anyway"

      - name: Ask the portfolio to rebuild
        if: env.TOKEN != ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/samarthya/samarthya.github.io/dispatches \
            -d '{"event_type":"blog-published","client_payload":{"sha":"${{ github.sha }}"}}'
          echo "Portfolio rebuild requested"
