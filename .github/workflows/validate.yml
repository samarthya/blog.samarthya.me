# Validate a pull request: privacy check + production build. Never deploys.
# Deployment stays in hugo.yml (push to main), which runs the same privacy check before building.
name: Validate pull request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0 # keep in sync with hugo.yml and mise.toml
      HUGO_ENVIRONMENT: production
      TZ: America/New_York
    steps:
      - name: Checkout (with Blowfish submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Privacy check (secrets, local paths, image metadata)
        run: |
          python3 -m unittest discover -s tools/privacy -v
          python3 tools/privacy/check.py

      - name: Install Hugo extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Build (not deployed)
        run: hugo --gc --minify
