# Per-post fixes applied by wp2hugo.py on every import, so re-imports keep them.
#   alt:         image file name (or URL) as written in the post -> alt text
#   description: front-matter description (replaces a weak auto-summary)
#   tags:        front-matter tags (replaces the imported ones; picks the post's topic via data/covers.yaml)
#   replace:     exact text in the converted post -> new text
# The importer stops with a list of any entry that no longer matches.

