# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://samarthya.me/"
defaultContentLanguage = "en"

# Imported posts link to each other with relref; while only some posts are imported,
# a link to a not-yet-imported post should warn, not break the build.
refLinksErrorLevel = "WARNING"
refLinksNotFoundURL = "/posts/"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 30 # words; feeds card teasers, RSS <description> and meta descriptions

buildDrafts = false
buildFuture = false

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

# Old WordPress URLs (/wps/YYYY/MM/DD/slug/) are kept alive via per-post `aliases`.
[permalinks]
  posts = "/posts/:slugorcontentbasename/"
  daily = "/daily/:year/:month/:slugorcontentbasename/"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# /latest.json: newest posts with card images, consumed by the portfolio site (layouts/index.latest.json)
[outputFormats.Latest]
  mediaType = "application/json"
  baseName = "latest"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "Latest"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

# GA4 property carried over from the WordPress site (ExactMetrics). Blowfish adds the gtag snippet
# only to production builds (hugo.IsProduction), so local previews are not counted.
[services.googleAnalytics]
  ID = "G-7JK3JP8ZB6"
