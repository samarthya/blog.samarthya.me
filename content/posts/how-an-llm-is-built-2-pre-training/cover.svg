  </g>
  <text xml:space="preserve" x="626" y="232" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">python tiny_lm.py</tspan></text><text xml:space="preserve" x="626" y="263" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#f87171">step   0  loss 2.958</text><text xml:space="preserve" x="626" y="294" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fbbf24">step 100  loss 0.122</text><text xml:space="preserve" x="626" y="325" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#4ade80">step 300  loss 0.125</text><text xml:space="preserve" x="626" y="356" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#67e8f9">t up. build again. fall. get up.</text><text xml:space="preserve" x="626" y="418" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#94a3b8"># Kimi K2: same loop, 15.5T tokens</text>
