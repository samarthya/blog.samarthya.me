<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a girl with long teal hair wearing a headset and holding a glowing light bulb, beside a terminal running the post&#x27;s tiny training loop: loss falls from 2.958 to 0.125 and the model writes back the motto; chips read MuonClip τ=100, 67M-token batches, 4K→128K</title>
  <defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddd6fe"/><stop offset="0.65" stop-color="#ede9fe"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
