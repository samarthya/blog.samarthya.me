<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Pre-training Kimi K2. One training step as a loop: read 67M tokens, guess the next tokens, score the loss, adjust with MuonClip, repeated about 230,000 times over 15.5T tokens (about 3 × 10^24 operations). QK-Clip: attention logits above 1,000 in a test run, capped at 100 in K2 with zero loss spikes. Learning rate: warm-up, 2e-4 for 10T tokens, decay to 2e-5 over 5.5T. H800 GPUs split 16-way pipeline, 16-way expert and ZeRO-1 data parallel, about 6 TB of parameters and gradients. Context window: 4K for most of the run, 32K for 60B tokens, then 128K with YaRN. Result: Kimi-K2-Base.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.55"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="vglow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#a78bfa" flood-opacity="0.7"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="70" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">HOW AN LLM IS BUILT · 2</text>
  <text x="60" y="120" fill="#ffffff" font-size="46" font-weight="800">Pre-training: guess, check, adjust</text>
  <text x="60" y="156" fill="#cbd5e1" font-size="21">The same four steps, about 230,000 times, on thousands of GPUs</text>
<rect x="60" y="190" width="360" height="300" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="2" filter="url(#vglow)"/>
  <text x="80" y="218" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="start">ONE TRAINING STEP</text>
  <ellipse cx="240" cy="352" rx="122" ry="80" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6 8"/>
  <rect x="184" y="250" width="112" height="44" rx="12" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="240" y="269" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">1 read</text><text x="240" y="286" fill="#a5f3fc" font-size="12" font-weight="600" text-anchor="middle">67M tokens</text>
  <rect x="306" y="330" width="112" height="44" rx="12" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="362" y="349" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">2 guess</text><text x="362" y="366" fill="#a5f3fc" font-size="12" font-weight="600" text-anchor="middle">next tokens</text>
  <rect x="184" y="410" width="112" height="44" rx="12" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="240" y="429" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">3 score</text><text x="240" y="446" fill="#a5f3fc" font-size="12" font-weight="600" text-anchor="middle">the loss</text>
  <rect x="62" y="330" width="112" height="44" rx="12" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="118" y="349" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">4 adjust</text><text x="118" y="366" fill="#a5f3fc" font-size="12" font-weight="600" text-anchor="middle">MuonClip</text>
  <text x="240" y="348" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">× 230,000</text><text x="240" y="370" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle">steps</text>
  <text x="80" y="476" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="start">15.5T tokens · C ≈ 6ND ≈ 3 × 10²⁴ FLOPs</text>
  <rect x="444" y="190" width="330" height="140" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="464" y="218" fill="#fca5a5" font-size="14" font-weight="700" text-anchor="start">QK-CLIP · τ = 100</text>
  <text x="464" y="248" fill="#e2e8f0" font-size="14" font-weight="400" text-anchor="start">test run: attention logits &gt; 1,000</text>
  <rect x="464" y="262" width="290" height="14" rx="7" fill="#334155"/><rect x="464" y="262" width="290" height="14" rx="7" fill="#ef4444" fill-opacity="0.8"/>
  <rect x="464" y="286" width="290" height="14" rx="7" fill="#334155"/><rect x="464" y="286" width="29" height="14" rx="7" fill="#22c55e"/>
  <text x="500" y="298" fill="#86efac" font-size="12" font-weight="700" text-anchor="start">K2: capped at 100 → 0 loss spikes</text>
  <rect x="444" y="350" width="330" height="140" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="464" y="378" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="start">LEARNING RATE</text>
  <path d="M470 470 L486 410 L660 410 C700 410 720 455 748 462" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <text x="560" y="402" fill="#a5f3fc" font-size="12" font-weight="600" text-anchor="middle">2e-4 for 10T tokens</text><text x="752" y="440" fill="#a5f3fc" font-size="12" font-weight="600" text-anchor="end">2e-5</text>
  <text x="470" y="486" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="start">warm-up</text><text x="754" y="486" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="end">decay over 5.5T</text>
  <rect x="798" y="190" width="342" height="300" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="818" y="218" fill="#fdba74" font-size="14" font-weight="700" text-anchor="start">SPLIT ACROSS H800 GPUs</text>
  <rect x="818" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa"/>
  <rect x="818" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee"/>
  <rect x="818" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e"/>
  <rect x="818" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.25" stroke="#f97316"/>
  <rect x="856" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.33" stroke="#a78bfa"/>
  <rect x="856" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.33" stroke="#22d3ee"/>
  <rect x="856" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.33" stroke="#22c55e"/>
  <rect x="856" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.33" stroke="#f97316"/>
  <rect x="894" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.41000000000000003" stroke="#a78bfa"/>
  <rect x="894" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.41000000000000003" stroke="#22d3ee"/>
  <rect x="894" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.41000000000000003" stroke="#22c55e"/>
  <rect x="894" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.41000000000000003" stroke="#f97316"/>
  <rect x="932" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa"/>
  <rect x="932" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee"/>
  <rect x="932" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e"/>
  <rect x="932" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.25" stroke="#f97316"/>
  <rect x="970" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.33" stroke="#a78bfa"/>
  <rect x="970" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.33" stroke="#22d3ee"/>
  <rect x="970" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.33" stroke="#22c55e"/>
  <rect x="970" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.33" stroke="#f97316"/>
  <rect x="1008" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.41000000000000003" stroke="#a78bfa"/>
  <rect x="1008" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.41000000000000003" stroke="#22d3ee"/>
  <rect x="1008" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.41000000000000003" stroke="#22c55e"/>
  <rect x="1008" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.41000000000000003" stroke="#f97316"/>
  <rect x="1046" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa"/>
  <rect x="1046" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee"/>
  <rect x="1046" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e"/>
  <rect x="1046" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.25" stroke="#f97316"/>
  <rect x="1084" y="234" width="32" height="24" rx="5" fill="#a78bfa" fill-opacity="0.33" stroke="#a78bfa"/>
  <rect x="1084" y="264" width="32" height="24" rx="5" fill="#22d3ee" fill-opacity="0.33" stroke="#22d3ee"/>
  <rect x="1084" y="294" width="32" height="24" rx="5" fill="#22c55e" fill-opacity="0.33" stroke="#22c55e"/>
  <rect x="1084" y="324" width="32" height="24" rx="5" fill="#f97316" fill-opacity="0.33" stroke="#f97316"/>
  <text x="818" y="384" fill="#ffffff" font-size="14" font-weight="700" text-anchor="start">16-way pipeline</text><text x="1122" y="384" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="end">slices of the 61 layers</text>
  <text x="818" y="418" fill="#ffffff" font-size="14" font-weight="700" text-anchor="start">16-way expert</text><text x="1122" y="418" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="end">shares of 384 experts</text>
  <text x="818" y="452" fill="#ffffff" font-size="14" font-weight="700" text-anchor="start">ZeRO-1 data</text><text x="1122" y="452" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="end">copies on other batches</text>
  <text x="818" y="480" fill="#fdba74" font-size="12" font-weight="600" text-anchor="start">~6 TB params + grads → ~30 GB/GPU left</text>
  <text x="60" y="528" fill="#86efac" font-size="14" font-weight="700" text-anchor="start">CONTEXT WINDOW</text>
  <rect x="60" y="540" width="1080" height="34" rx="10" fill="#111827" stroke="#334155"/>
  <rect x="60" y="540" width="34" height="34" rx="10" fill="#22c55e" fill-opacity="0.6"/>
  <rect x="60" y="540" width="270" height="34" rx="10" fill="#22c55e" fill-opacity="0.33"/>
  <rect x="60" y="540" width="1080" height="34" rx="10" fill="#22c55e" fill-opacity="0.15"/>
  <text x="77" y="562" fill="#0b1020" font-size="13" font-weight="800" text-anchor="middle">4K</text><text x="250" y="562" fill="#dcfce7" font-size="13" font-weight="700" text-anchor="middle">32K: 60B tokens</text><text x="1124" y="562" fill="#dcfce7" font-size="13" font-weight="700" text-anchor="end">128K with YaRN</text><text x="600" y="562" fill="#86efac" font-size="13" font-weight="600" text-anchor="middle">4K for most of the run, then stretch</text>
  <text x="60" y="600" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">Result: Kimi-K2-Base, fluent at continuing text, not yet an assistant</text>
</svg>
