<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a sloth holding a lantern, beside a terminal titled journal showing systemctl list-units --show-types | grep kubelet; kubelet.service  loaded active running; journalctl -u kubelet</title>
