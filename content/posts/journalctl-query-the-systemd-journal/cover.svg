  </g>
  <text xml:space="preserve" x="626" y="242" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">systemctl list-units --show-types | grep kubelet</tspan></text><text xml:space="preserve" x="626" y="273" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#4ade80">kubelet.service  loaded active running</text><text xml:space="preserve" x="626" y="304" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">journalctl -u kubelet</tspan></text>
