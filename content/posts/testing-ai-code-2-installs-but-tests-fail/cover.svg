<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a puzzled brown bear in a chef's hat and apron scratches its head, holding one egg, next to an egg carton labelled dependencies with two empty cups tagged chardet? and requests?, a green pip install badge above, and a pytest board showing five passes and three failures, scored 5 of 8</title>
