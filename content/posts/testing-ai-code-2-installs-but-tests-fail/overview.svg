  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="56" y="70" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#fca5a5">TESTING CODE AN AI WROTE · 2</text>
  <text x="56" y="124" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Installs fine, tests fail</text>
  <text x="56" y="160" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Install, run the tests as shipped, then help a little and look again</text>
<rect x="56" y="196" width="328" height="250" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2" filter="url(#sh)"/><text x="78" y="230" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#22c55e" text-anchor="start" xml:space="preserve">1 · INSTALL</text><rect x="436" y="196" width="328" height="250" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2" filter="url(#sh)"/><text x="458" y="230" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#ef4444" text-anchor="start" xml:space="preserve">2 · PYTEST, AS SHIPPED</text><rect x="816" y="196" width="328" height="250" rx="14" fill="#111827" stroke="#d97706" stroke-width="2" filter="url(#sh)"/><text x="838" y="230" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#d97706" text-anchor="start" xml:space="preserve">3 · PYTEST, +2 PACKAGES</text><text x="78" y="280" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">$ pip install -e .[dev]</text><text x="78" y="312" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">$ dupfind --version</text><text x="78" y="344" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#22c55e" text-anchor="start" xml:space="preserve">dupfind 0.1.0</text><rect x="78" y="390" width="120" height="28" rx="14" fill="#22c55e"/><text x="138.0" y="409.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">WORKS</text><text x="458" y="280" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#fca5a5" text-anchor="start" xml:space="preserve">ModuleNotFoundError:</text><text x="458" y="312" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">  chardet   (core code)</text><text x="458" y="344" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">  requests  (tests)</text><rect x="458" y="390" width="230" height="28" rx="14" fill="#ef4444"/><text x="573.0" y="409.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">3 COLLECTION ERRORS</text><circle cx="905" cy="330" r="62" fill="none" stroke="#7f1d1d" stroke-width="16"/><circle cx="905" cy="330" r="62" fill="none" stroke="#22c55e" stroke-width="16" stroke-dasharray="243.5 389.6" transform="rotate(-90 905 330)" stroke-linecap="butt"/><text x="905" y="342" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">5/8</text><text x="990" y="292" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="start" xml:space="preserve">✗ same path twice</text><text x="990" y="322" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="start" xml:space="preserve">✗ 20% size gate</text><text x="990" y="352" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="start" xml:space="preserve">✗ 403 on 127.0.0.1</text><text x="990" y="382" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fcd34d" text-anchor="start" xml:space="pr