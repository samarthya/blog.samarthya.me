anchor="start" xml:space="preserve">2 partly</text><rect x="456" y="572" width="16" height="16" rx="4" fill="#f97316"/><text x="480" y="586" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="start" xml:space="preserve">1 passes by luck</text><rect x="656" y="572" width="16" height="16" rx="4" fill="#ef4444"/><text x="680" y="586" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="start" xml:space="preserve">8 missing, all safety</text><text x="852" y="540" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="start" xml:space="preserve">hard links · symlinks · schema · auto &lt; 100%</text><text x="852" y="562" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="start" xml:space="preserve">changed file · last copy · restore · Host</text>
