<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Install and test results: pip install works and dupfind --version prints 0.1.0; pytest as generated stops with 3 collection errors for missing chardet and requests; after adding them, 5 tests pass and 3 fail; of the 12 tests the specification required, 1 is covered, 2 partly, 1 passes by luck and 8 safety tests are missing</title>
