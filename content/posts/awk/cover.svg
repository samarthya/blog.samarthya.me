  </g>
  <ellipse cx="212" cy="290" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <defs><clipPath id="cR"><ellipse cx="328" cy="290" rx="30" ry="36"/></clipPath><linearGradient id="cRg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#334155"/></linearGradient></defs>
  <ellipse cx="328" cy="290" rx="30" ry="36" fill="#ffffff"/>
  <g clip-path="url(#cR)">
    <ellipse cx="338" cy="288" rx="22.5" ry="27.0" fill="url(#cRg)"/>
    <ellipse cx="338" cy="286" rx="10.125" ry="13.5" fill="#111827"/>
    <circle cx="330.125" cy="277.2" r="7.199999999999999" fill="#ffffff"/>
    <circle cx="345.875" cy="297.45" r="3.0" fill="#ffffff"/>
  </g>
  <ellipse cx="328" cy="290" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <ellipse cx="176" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/><ellipse cx="364" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
  
  
  <path d="M400 500 C430 470 445 440 450 412" stroke="url(#cfur)" stroke-width="48" fill="none" stroke-linecap="round"/>
  <g filter="url(#drop)"><path d="M218 316 Q270 296 322 316 L270 410Z" fill="#f97316" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/><path d="M218 316 Q270 296 322 316 L314 334 Q270 318 226 334Z" fill="#64748b"/><path d="M232 348 Q270 334 308 348 L300 362 Q270 350 240 362Z" fill="#facc15"/><path d="M270 330 L270 404" stroke="#9a3412" stroke-width="2" opacity="0.6"/></g><path d="M176 268 L150 250 M364 268 L390 250" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><g filter="url(#drop)" transform="rotate(-20 510 352)"><ellipse cx="510" cy="352" rx="60" ry="24" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><path d="M568 352 L600 328 L600 376Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><circle cx="472" cy="346" r="5" fill="#1e3a8a"/><text x="516" y="360" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="800" fill="#1e3a8a">$1</text></g>
  <circle cx="450" cy="392" r="28" fill="#1e293b" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><ellipse cx="200" cy="520" rx="34" ry="26" fill="#1e293b" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><use href="#spark" x="40" y="70" width="24" height="24"/><use href="#spark" x="560" y="40" width="18" height="18"/><use href="#spark" x="1165" y="600" width="22" height="22"/>
