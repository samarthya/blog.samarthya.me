  <ellipse cx="270" cy="290" rx="165" ry="138" fill="url(#cfur)" filter="url(#drop)"/><ellipse cx="230" cy="190" rx="70" ry="28" fill="url(#cshine)" transform="rotate(-15 230 190)"/>
  <path d="M140 300 C140 220 200 200 270 230 C340 200 400 220 400 300 C400 370 340 400 270 400 C200 400 140 370 140 300Z" fill="#f8fafc"/>
  
  <defs><clipPath id="cL"><ellipse cx="212" cy="290" rx="30" ry="36"/></clipPath><linearGradient id="cLg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#334155"/></linearGradient></defs>
  <ellipse cx="212" cy="290" rx="30" ry="36" fill="#ffffff"/>
