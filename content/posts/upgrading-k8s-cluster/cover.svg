<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a boy with curly brown hair wearing a hard hat holding a wrench, beside a terminal titled master showing kubeadm upgrade plan; k drain node-1 --ignore-daemonsets; node/node-1 drained; kubeadm upgrade node; systemctl restart kubelet; k uncordon node-1; node/node-1 uncordoned</title>
