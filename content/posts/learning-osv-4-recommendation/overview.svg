<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Where OSV fits: a loop of pull request scan, scheduled rescan, in-place fix as a bot pull request, and human review, fed by OSV.dev; with the recommendation as a checklist</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.35"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b91c1c"/><stop offset="0.5" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <text x="60" y="78" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">LEARNING OSV · 4</text>
  <text x="60" y="132" fill="#ffffff" font-size="50" font-weight="800">Where it fits</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="22">My verdict, after the proof of concept.</text>

  <!-- Verdict checklist -->
  <g font-size="18" font-weight="600">
    <g transform="translate(60,222)">
      <rect width="470" height="58" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
      <circle cx="30" cy="29" r="15" fill="#16a34a"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">✓</text>
      <text x="58" y="25" fill="#fff">Adopt the scanner now</text><text x="58" y="46" fill="#94a3b8" font-size="14" font-weight="400">two workflows, free, precise</text>
    </g>
    <g transform="translate(60,292)">
      <rect width="470" height="58" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
      <circle cx="30" cy="29" r="15" fill="#16a34a"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">✓</text>
      <text x="58" y="25" fill="#fff">Scheduled rescan first</text><text x="58" y="46" fill="#94a3b8" font-size="14" font-weight="400">new advisories land on old code</text>
    </g>
    <g transform="translate(60,362)">
      <rect width="470" height="58" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
      <circle cx="30" cy="29" r="15" fill="#16a34a"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">✓</text>
      <text x="58" y="25" fill="#fff">Bots do in-place fixes only</text><text x="58" y="46" fill="#94a3b8" font-size="14" font-weight="400">tests required, a human merges</text>
    </g>
    <g transform="translate(60,432)">
      <rect width="470" height="58" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
      <circle cx="30" cy="29" r="15" fill="#d97706"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">!</text>
      <text x="58" y="25" fill="#fff">relax = a planned upgrade</text><text x="58" y="46" fill="#94a3b8" font-size="14" font-weight="400">run by a developer, never a bot</text>
    </g>
    <g transform="translate(60,502)">
      <rect width="470" height="58" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
      <circle cx="30" cy="29" r="15" fill="#2563eb"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">+</text>
      <text x="58" y="25" fill="#fff">Add a risk layer on top</text><text x="58" y="46" fill="#94a3b8" font-size="14" font-weight="400">exploited? exposed? before deadlines</text>
    </g>
  </g>

  <!-- Loop -->
  <g transform="translate(870,400)">
    <circle r="190" fill="url(#core)"/>
    <circle r="132" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 9"/>
    <!-- direction arrows on the ring (clockwise) -->
    <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)">
      <path d="M 77 -107 A 132 132 0 0 1 107 -77"/>
      <path d="M 107 77 A 132 132 0 0 1 77 107"/>
      <path d="M -77 107 A 132 132 0 0 1 -107 77"/>
      <path d="M -107 -77 A 132 132 0 0 1 -77 -107"/>
    </g>

    <!-- database in the middle -->
    <g transform="translate(-52,-48)" filter="url(#shadow)">
      <path d="M0 14 v66 a52 14 0 0 0 104 0 v-66" fill="url(#db)"/>
      <ellipse cx="52" cy="14" rx="52" ry="14" fill="#fca5a5"/>
      <text x="52" y="58" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">OSV.dev</text>
      <text x="52" y="78" text-anchor="middle" fill="#fee2e2" font-size="11">new advisories</text>
    </g>

    <!-- stations -->
    <g text-anchor="middle" filter="url(#shadow)">
      <g transform="translate(0,-132)">
        <circle r="38" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
        <text y="9" fill="#22d3ee" font-size="26" font-weight="800">PR</text>
      </g>
      <g transform="translate(132,0)">
        <circle r="38" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
        <text y="10" fill="#a78bfa" font-size="28" font-weight="800">⟳</text>
      </g>
      <g transform="translate(0,132)">
        <circle r="38" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
        <text y="10" fill="#22c55e" font-size="26" font-weight="800">fix</text>
      </g>
      <g transform="translate(-132,0)">
        <circle r="38" fill="#1e293b" stroke="#facc15" stroke-width="3"/>
        <text y="10" fill="#facc15" font-size="26" font-weight="800">✓</text>
      </g>
    </g>

    <!-- station labels -->
    <g font-size="15" font-weight="700">
      <text x="0" y="-190" text-anchor="middle" fill="#fff">Pull request</text>
      <text x="0" y="-172" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">new findings only</text>
      <text x="182" y="-6" fill="#fff">Scheduled</text>
      <text x="182" y="12" fill="#94a3b8" font-size="13" font-weight="500">rescan main</text>
      <text x="0" y="192" text-anchor="middle" fill="#fff">in-place → bot PR</text>
      <text x="0" y="210" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">osv-scanner fix</text>
      <text x="-182" y="-6" text-anchor="end" fill="#fff">Review</text>
      <text x="-182" y="12" text-anchor="end" fill="#94a3b8" font-size="13" font-weight="500">tests + a human</text>
    </g>
  </g>
</svg>
