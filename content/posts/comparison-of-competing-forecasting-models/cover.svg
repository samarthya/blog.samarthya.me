  <path d="M320 420 C360 400 380 360 390 320" stroke="url(#pgb)" stroke-width="44" fill="none" stroke-linecap="round"/>
  <g filter="url(#drop)">
    <path d="M370 300 L400 240 L430 300Z" fill="url(#cone)" transform="rotate(180 400 270)"/>
    <circle cx="400" cy="222" r="30" fill="#fbcfe8"/><circle cx="380" cy="200" r="24" fill="#a7f3d0"/><circle cx="418" cy="196" r="24" fill="#fde68a"/>
    <circle cx="400" cy="170" r="10" fill="#ef4444"/>
  </g>
  <!-- feet -->
  <ellipse cx="150" cy="622" rx="40" ry="14" fill="#f59e0b"/><ellipse cx="250" cy="622" rx="40" ry="14" fill="#f59e0b"/>
  <g filter="url(#drop)"><rect x="610" y="40" width="560" height="360" rx="18" fill="#ffffff"/></g>
  <text x="640" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#1f2937">cones sold vs forecast</text>
  <rect x="640" y="98" width="16" height="12" rx="3" fill="#bae6fd"/><text x="662" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">actual</text>
  <rect x="728" y="102" width="22" height="4" fill="#16a34a"/><text x="756" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">model A</text>
  <rect x="838" y="102" width="22" height="4" fill="#ef4444"/><text x="866" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">model B</text>
  <path d="M640 350 H1140" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="652" y="304" width="36" height="46" rx="6" fill="#bae6fd"/><rect x="725" y="254" width="36" height="96" rx="6" fill="#bae6fd"/><rect x="799" y="231" width="36" height="119" rx="6" fill="#bae6fd"/><rect x="872" y="281" width="36" height="69" rx="6" fill="#bae6fd"/><rect x="945" y="197" width="36" height="153" rx="6" fill="#bae6fd"/><rect x="1019" y="147" width="36" height="203" rx="6" fill="#bae6fd"/><rect x="1092" y="212" width="36" height="138" rx="6" fill="#bae6fd"/><text x="670" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">M</text><text x="743" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">T</text><text x="817" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">W</text><text x="890" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">T</text><text x="963" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">F</text><text x="1037" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">S</text><text x="1110" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">S</text>
  <path d="M670 243 L743 296 L817 181 L890 227 L963 266 L1037 220 L1110 135" stroke="#ef4444" stroke-width="3" fill="none" stroke-dasharray="8 6"/><circle cx="670" cy="243" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><circle cx="743" cy="296" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><circle cx="817" cy="181" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><circle cx="890" cy="227" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><circle cx="963" cy="266" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><circle cx="1037" cy="220" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><circle cx="1110" cy="135" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <path d="M670 292 L743 266 L817 243 L890 270 L963 212 L1037 158 L1110 197" stroke="#16a34a" stroke-width="3" fill="none"/><circle cx="670" cy="292" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/><circle cx="743" cy="266" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/><circle cx="817" cy="243" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/><circle cx="890" cy="270" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/><circle cx="963" cy="212" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/><circle cx="1037" cy="158" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/><circle cx="1110" cy="197" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <g filter="url(#drop)"><rect x="610" y="420" width="560" height="190" rx="18" fill="#1e293b"/></g>
  <text x="900" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#86efac">model A</text>
  <text x="1060" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#fca5a5">model B</text>
  <text x="640" y="486" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#e2e8f0">MAE</text>
  <text x="900" y="486" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#4ade80">3.3</text>
  <text x="1060" y="486" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#f87171">15.9</text><text x="640" y="520" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#e2e8f0">RMSE</text>
  <text x="900" y="520" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#4ade80">3.3</text>
  <text x="1060" y="520" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#f87171">16.2</text><text x="640" y="554" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#e2e8f0">MAPE</text>
  <text x="900" y="554" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#4ade80">5.6%</text>
  <text x="1060" y="554" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#f87171">26.8%</text><text x="640" y="588" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#e2e8f0">Theil's U</text>
  <text x="900" y="588" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#4ade80">0.22</text>
  <text x="1060" y="588" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#f87171">1.01</text><use href="#spark" x="40" y="60" width="24" height="24"/><use href="#spark" x="470" y="80" width="20" height="20"/><use href="#spark" x="580" y="420" width="16" height="16"/>
