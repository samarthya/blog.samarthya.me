<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>A visitor reaches the origin two ways. Orange cloud, proxied: through the Cloudflare edge, present in 348 cities, which answers DNS and handles TLS, cache, rules and the WAF. Grey cloud, DNS only: straight to the origin.</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset=".55" stop-color="#0d1330"/><stop offset="1" stop-color="#1a1440"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6821f"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#f6821f"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
</defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="860" cy="360" r="190" fill="#f6821f" opacity="0.3" filter="url(#blur)"/><circle cx="230" cy="560" r="170" fill="#a78bfa" opacity="0.28" filter="url(#blur)"/><circle cx="1120" cy="90" r="140" fill="#22d3ee" opacity="0.18" filter="url(#blur)"/><rect width="1200" height="630" fill="url(#dots)"/><text x="60" y="76" fill="#f6821f" font-size="17" font-weight="700" letter-spacing="3.5">CLOUDFLARE, PLAINLY · 1</text><text x="60" y="128" fill="#f8fafc" font-size="46" font-weight="800">An introduction</text><text x="60" y="166" fill="#cbd5e1" font-size="21">A front desk for your domain: DNS, the proxy and the edge.</text><g filter="url(#shadow)"><rect x="60" y="250" width="200" height="150" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="60" y="250" width="200" height="150" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><rect x="92" y="278" width="136" height="86" rx="10" fill="none" stroke="#22d3ee" stroke-width="2"/><circle cx="104" cy="290" r="3" fill="#f87171"/><circle cx="114" cy="290" r="3" fill="#fbbf24"/><circle cx="124" cy="290" r="3" fill="#4ade80"/><text x="160" y="336" fill="#cbd5e1" font-size="14" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">example.com</text><text x="160" y="388" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2.5">VISITOR</text><circle cx="600" cy="330" r="118" fill="#f6821f" opacity=".10"/><circle cx="600" cy="330" r="92" fill="#0b1124" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/><path transform="translate(600,300) scale(1.25)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#f6821f"/><text x="600" y="356" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="4">EDGE</text><text x="600" y="380" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">348 cities</text><rect x="410" y="470" width="68" height="26" rx="13" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-opacity=".7"/><text x="444.0" y="488" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">DNS</text><rect x="490" y="470" width="68" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-opacity=".7"/><text x="524.0" y="488" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">TLS</text><rect x="570" y="470" width="68" height="26" rx="13" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24" stroke-opacity=".7"/><text x="604.0" y="488" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">Cache</text><rect x="650" y="470" width="68" height="26" rx="13" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".7"/><text x="684.0" y="488" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">Rules</text><rect x="730" y="470" width="68" height="26" rx="13" fill="#f87171" fill-opacity=".16" stroke="#f87171" stroke-opacity=".7"/><text x="764.0" y="488" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">WAF</text><g filter="url(#shadow)"><rect x="940" y="250" width="200" height="150" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="940" y="250" width="200" height="150" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><rect x="985" y="276" width="110" height="18" rx="5" fill="none" stroke="#a78bfa" stroke-width="1.8"/><circle cx="1083" cy="285" r="3" fill="#4ade80"/><rect x="985" y="302" width="110" height="18" rx="5" fill="none" stroke="#a78bfa" stroke-width="1.8"/><circle cx="1083" cy="311" r="3" fill="#4ade80"/><rect x="985" y="328" width="110" height="18" rx="5" fill="none" stroke="#a78bfa" stroke-width="1.8"/><circle cx="1083" cy="337" r="3" fill="#4ade80"/><text x="1040" y="388" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2.5">ORIGIN</text><path d="M262 318 C350 318 420 318 506 318" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/><path d="M694 318 C780 318 850 318 938 318" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/><text x="384" y="300" fill="#f6821f" font-size="14" font-weight="700" text-anchor="middle">orange cloud: proxied</text><text x="816" y="300" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="middle">only Cloudflare knocks</text><path d="M160 402 C160 560 1040 560 1040 402" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8"/><rect x="510" y="532" width="180" height="28" rx="14" fill="#0b1124"/><text x="600" y="551" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">grey cloud: DNS only</text><text x="60" y="604" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">95% of internet users within 50 ms of the edge</text></svg>
