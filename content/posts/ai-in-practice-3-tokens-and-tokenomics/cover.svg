    <text x="110" y="598.4" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="800" fill="#92400e">␣</text>
  </g>
  <g filter="url(#drop)" transform="rotate(10 170 604)">
    <circle cx="170" cy="604" r="30" fill="url(#gold)" stroke="#b45309" stroke-width="3"/>
    <circle cx="170" cy="604" r="23" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="170" y="612.4" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="800" fill="#92400e">s</text>
  </g>
  <g filter="url(#drop)" transform="rotate(-12 470 598)">
    <circle cx="470" cy="598" r="30" fill="url(#gold)" stroke="#b45309" stroke-width="3"/>
    <circle cx="470" cy="598" r="23" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="470" y="606.4" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="800" fill="#92400e">'t</text>
  </g>
