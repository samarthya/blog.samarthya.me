    <text x="486" y="341.28" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="800" fill="#92400e">en</text>
  </g>
  <!-- paws holding a coin -->
  
  <g filter="url(#drop)" transform="rotate(-6 300 470)">
    <circle cx="300" cy="470" r="54" fill="url(#gold)" stroke="#b45309" stroke-width="3"/>
    <circle cx="300" cy="470" r="47" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="300" y="485.12" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="39" font-weight="800" fill="#92400e">tok</text>
  </g>
  <ellipse cx="236" cy="470" rx="28" ry="22" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
  <ellipse cx="364" cy="470" rx="28" ry="22" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
  <!-- coin pile -->
  
  <g filter="url(#drop)" transform="rotate(0 110 590)">
