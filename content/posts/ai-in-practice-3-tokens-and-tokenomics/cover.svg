  <ellipse cx="170" cy="350" rx="90" ry="78" fill="url(#hfur)"/>
  <ellipse cx="430" cy="350" rx="90" ry="78" fill="url(#hfur)"/>
  <ellipse cx="300" cy="360" rx="96" ry="66" fill="#fff7ed"/>
  
  <defs><clipPath id="hmL"><ellipse cx="240" cy="280" rx="30" ry="34"/></clipPath><linearGradient id="hmLg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#475569"/></linearGradient></defs>
