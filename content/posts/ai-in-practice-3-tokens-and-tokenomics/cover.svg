  </g>
  <g filter="url(#drop)"><rect x="600" y="102" width="66" height="46" rx="10" fill="#fecaca" stroke="#334155" stroke-width="2"/><text xml:space="preserve" x="609" y="132" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#0f172a">Lang</text><rect x="674" y="102" width="66" height="46" rx="10" fill="#fde68a" stroke="#334155" stroke-width="2"/><text xml:space="preserve" x="683" y="132" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#0f172a">uage</text><rect x="748" y="102" width="102" height="46" rx="10" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text xml:space="preserve" x="757" y="132" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#0f172a">␣models</text><rect x="858" y="102" width="66" height="46" rx="10" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text xml:space="preserve" x="867" y="132" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#0f172a">␣don</text><rect x="932" y="102" width="42" height="46" rx="10" fill="#ddd6fe" stroke="#334155" stroke-width="2"/><text xml:space="preserve" x="941" y="132" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#0f172a">'t</text><rect x="982" y="102" width="78" height="46" rx="10" fill="#fbcfe8" stroke="#334155" stroke-width="2"/><text xml:space="preserve" x="991" y="132" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#0f172a">␣read</text><rect x="1068" y="102" width="90" height="46" rx="10" fill="#a5f3fc" stroke="#334155" stroke-width="2"/><text xml:space="preserve" x="1077" y="132" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#0f172a">␣words</text></g>
  <text x="600" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#475569">7 tokens · 1 token ≈ 4 characters</text>
  <g filter="url(#drop)">
    <rect x="610" y="220" width="530" height="300" rx="18" fill="#ffffff"/>
    <path d="M610 276 V238 Q610 220 628 220 H1122 Q1140 220 1140 238 V276Z" fill="#1e293b"/>
    <text x="634" y="257" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="800" fill="#a5f3fc">per million tokens</text>
  </g>
  <text x="640" y="300" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#334155">input</text><text x="1110" y="300" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#0f172a">× $3</text><text x="640" y="346" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#334155">output</text><text x="1110" y="346" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#0f172a">× $15</text>
  <path d="M640 368 H1110" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="640" y="408" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#334155">1,000 tokens</text>
  <text x="1110" y="408" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#0f172a">≈ 750 words</text>
  <text x="640" y="452" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#334155">output costs</text>
  <text x="1110" y="452" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#dc2626">5× input</text>
  <text x="640" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-style="italic" fill="#64748b">made-up prices, to show the arithmetic</text><use href="#spark" x="40" y="70" width="26" height="26"/><use href="#spark" x="560" y="60" width="18" height="18"/><use href="#spark" x="1160" y="600" width="24" height="24"/><use href="#spark" x="560" y="420" width="16" height="16"/>
