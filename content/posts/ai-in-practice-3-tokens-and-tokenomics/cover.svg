  <ellipse cx="300" cy="332" rx="13" ry="9" fill="#f472b6"/>
  <path d="M300 341 L300 354 M300 354 C292 366 280 366 274 358 M300 354 C308 366 320 366 326 358" stroke="#9a3412" stroke-width="3.5" fill="none" stroke-linecap="round"/>
