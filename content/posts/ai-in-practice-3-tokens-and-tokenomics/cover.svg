  <ellipse cx="180" cy="170" rx="44" ry="40" fill="url(#hfur)"/><ellipse cx="180" cy="172" rx="26" ry="22" fill="#fda4af"/>
  <ellipse cx="420" cy="170" rx="44" ry="40" fill="url(#hfur)"/><ellipse cx="420" cy="172" rx="26" ry="22" fill="#fda4af"/>
