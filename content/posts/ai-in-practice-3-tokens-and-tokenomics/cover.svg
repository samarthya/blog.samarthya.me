  </g>
  <ellipse cx="240" cy="280" rx="30" ry="34" fill="none" stroke="#1f2937" stroke-width="4"/>
  
  <defs><clipPath id="hmR"><ellipse cx="360" cy="280" rx="30" ry="34"/></clipPath><linearGradient id="hmRg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#475569"/></linearGradient></defs>
  <ellipse cx="360" cy="280" rx="30" ry="34" fill="#ffffff"/>
  <g clip-path="url(#hmR)">
    <ellipse cx="372" cy="278" rx="22.5" ry="25.5" fill="url(#hmRg)"/>
    <ellipse cx="372" cy="276" rx="10.125" ry="12.75" fill="#111827"/>
