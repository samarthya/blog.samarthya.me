  </g><text x="626" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2937">“Event streaming is the digital</text><text x="626" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2937">equivalent of the human body&#x27;s</text><text x="626" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2937">central nervous system.”</text><text x="626" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#334155">distributed · secure · fault-tolerant</text>
