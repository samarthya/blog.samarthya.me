<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a beaver engineer in a yellow hard hat and orange safety vest holds up a wrench beside a pipeline: train.csv flows into train, then evaluate, then a diamond asking better?, then a deployed endpoint, with a dashed arrow that says again next week</title>
