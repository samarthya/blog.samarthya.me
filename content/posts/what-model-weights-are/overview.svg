<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>From one neuron to a 19 GB file: a neuron with three weights, a weight matrix of numbers, 48 layers of 128 experts with 8 lit for one token, and the Qwen3-Coder 30B file split into 14.5 GB of 4-bit experts, 3.1 GB of 16-bit weights and 1.8 GB of scales</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="lit" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Heading -->
  <text x="60" y="78" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">AI, PLAINLY · MODEL WEIGHTS</text>
  <text x="60" y="132" fill="#ffffff" font-size="50" font-weight="800">What model weights are</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="22">From one neuron's three numbers to 30.5 billion of them in a 19 GB file.</text>

  <!-- Stage labels -->
  <g font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">
    <text x="60" y="232">1 · A NEURON</text>
    <text x="340" y="232">2 · A WEIGHT MATRIX</text>
    <text x="620" y="232">3 · LAYERS OF EXPERTS</text>
    <text x="900" y="232">4 · THE FILE</text>
  </g>

  <!-- Card 1: neuron -->
  <g filter="url(#shadow)"><rect x="50" y="248" width="250" height="320" rx="16" fill="url(#card)" stroke="#334155"/></g>
  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#e2e8f0">
    <circle cx="96" cy="320" r="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="96" y="326" text-anchor="middle">x1</text>
    <circle cx="96" cy="400" r="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="96" y="406" text-anchor="middle">x2</text>
    <circle cx="96" cy="480" r="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="96" y="486" text-anchor="middle">x3</text>
    <path d="M114 322 L232 394" stroke="#a78bfa" stroke-width="5"/>
    <path d="M114 400 L230 400" stroke="#a78bfa" stroke-width="2"/>
    <path d="M114 478 L232 406" stroke="#a78bfa" stroke-width="3.5"/>
    <circle cx="252" cy="400" r="24" fill="#4c1d95" stroke="#a78bfa" stroke-width="2.5"/><text x="252" y="406" text-anchor="middle" font-weight="700">y</text>
    <g font-size="14" fill="#c4b5fd">
      <text x="150" y="340">w1 0.81</text>
      <text x="140" y="388">w2 −0.12</text>
      <text x="150" y="470">w3 0.47</text>
    </g>
  </g>
  <text x="175" y="545" text-anchor="middle" fill="#cbd5e1" font-size="15">Learned numbers. Change them,</text>
  <text x="175" y="563" text-anchor="middle" fill="#cbd5e1" font-size="15">change the answer.</text>

  <!-- Card 2: matrix -->
  <g filter="url(#shadow)"><rect x="330" y="248" width="250" height="320" rx="16" fill="url(#card)" stroke="#334155"/></g>
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#cbd5e1">
    <text x="352" y="300">[</text><text x="560" y="300" text-anchor="end">]</text>
    <text x="412" y="300" text-anchor="end">0.81</text>
    <text x="462" y="300" text-anchor="end">−0.12</text>
    <text x="512" y="300" text-anchor="end">0.47</text>
    <text x="548" y="300" text-anchor="end">…</text>
    <text x="352" y="326">[</text><text x="560" y="326" text-anchor="end">]</text>
    <text x="412" y="326" text-anchor="end">−0.33</text>
    <text x="462" y="326" text-anchor="end">0.05</text>
    <text x="512" y="326" text-anchor="end">1.20</text>
    <text x="548" y="326" text-anchor="end">…</text>
    <text x="352" y="352">[</text><text x="560" y="352" text-anchor="end">]</text>
    <text x="412" y="352" text-anchor="end">0.18</text>
    <text x="462" y="352" text-anchor="end">0.92</text>
    <text x="512" y="352" text-anchor="end">−0.61</text>
    <text x="548" y="352" text-anchor="end">…</text>
    <text x="352" y="378">[</text><text x="560" y="378" text-anchor="end">]</text>
    <text x="412" y="378" text-anchor="end">0.07</text>
    <text x="462" y="378" text-anchor="end">−0.44</text>
    <text x="512" y="378" text-anchor="end">0.29</text>
    <text x="548" y="378" text-anchor="end">…</text>
    <text x="352" y="404">[</text><text x="560" y="404" text-anchor="end">]</text>
    <text x="412" y="404" text-anchor="end">⋮</text>
    <text x="462" y="404" text-anchor="end">⋮</text>
    <text x="512" y="404" text-anchor="end">⋮</text>
  </g>
  <rect x="352" y="428" width="206" height="34" rx="17" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee"/>
  <text x="455" y="451" text-anchor="middle" fill="#a5f3fc" font-size="15" font-weight="700" font-family="Consolas, Menlo, monospace">2,048 × 768 per matrix</text>
  <text x="455" y="545" text-anchor="middle" fill="#cbd5e1" font-size="15">A whole layer's weights:</text>
  <text x="455" y="563" text-anchor="middle" fill="#cbd5e1" font-size="15">one grid of numbers.</text>

  <!-- Card 3: experts -->
  <g filter="url(#shadow)"><rect x="610" y="248" width="250" height="320" rx="16" fill="url(#card)" stroke="#334155"/></g>
  <g>
    <!-- 16 x 8 grid = 128 experts; 8 lit -->
    <g fill="#334155">
      <rect x="634" y="278" width="10" height="10" rx="2"/><rect x="647" y="278" width="10" height="10" rx="2"/><rect x="660" y="278" width="10" height="10" rx="2"/><rect x="673" y="278" width="10" height="10" rx="2"/><rect x="686" y="278" width="10" height="10" rx="2"/><rect x="699" y="278" width="10" height="10" rx="2"/><rect x="712" y="278" width="10" height="10" rx="2"/><rect x="725" y="278" width="10" height="10" rx="2"/><rect x="738" y="278" width="10" height="10" rx="2"/><rect x="751" y="278" width="10" height="10" rx="2"/><rect x="764" y="278" width="10" height="10" rx="2"/><rect x="777" y="278" width="10" height="10" rx="2"/><rect x="790" y="278" width="10" height="10" rx="2"/><rect x="803" y="278" width="10" height="10" rx="2"/><rect x="816" y="278" width="10" height="10" rx="2"/><rect x="829" y="278" width="10" height="10" rx="2"/>
    </g>
  </g>
  <g fill="#334155">
    <path d="M634 291h10v10h-10zM647 291h10v10h-10zM660 291h10v10h-10zM673 291h10v10h-10zM686 291h10v10h-10zM699 291h10v10h-10zM712 291h10v10h-10zM725 291h10v10h-10zM738 291h10v10h-10zM751 291h10v10h-10zM764 291h10v10h-10zM777 291h10v10h-10zM790 291h10v10h-10zM803 291h10v10h-10zM816 291h10v10h-10zM829 291h10v10h-10z"/>
    <path d="M634 304h10v10h-10zM647 304h10v10h-10zM660 304h10v10h-10zM673 304h10v10h-10zM686 304h10v10h-10zM699 304h10v10h-10zM712 304h10v10h-10zM725 304h10v10h-10zM738 304h10v10h-10zM751 304h10v10h-10zM764 304h10v10h-10zM777 304h10v10h-10zM790 304h10v10h-10zM803 304h10v10h-10zM816 304h10v10h-10zM829 304h10v10h-10z"/>
    <path d="M634 317h10v10h-10zM647 317h10v10h-10zM660 317h10v10h-10zM673 317h10v10h-10zM686 317h10v10h-10zM699 317h10v10h-10zM712 317h10v10h-10zM725 317h10v10h-10zM738 317h10v10h-10zM751 317h10v10h-10zM764 317h10v10h-10zM777 317h10v10h-10zM790 317h10v10h-10zM803 317h10v10h-10zM816 317h10v10h-10zM829 317h10v10h-10z"/>
    <path d="M634 330h10v10h-10zM647 330h10v10h-10zM660 330h10v10h-10zM673 330h10v10h-10zM686 330h10v10h-10zM699 330h10v10h-10zM712 330h10v10h-10zM725 330h10v10h-10zM738 330h10v10h-10zM751 330h10v10h-10zM764 330h10v10h-10zM777 330h10v10h-10zM790 330h10v10h-10zM803 330h10v10h-10zM816 330h10v10h-10zM829 330h10v10h-10z"/>
    <path d="M634 343h10v10h-10zM647 343h10v10h-10zM660 343h10v10h-10zM673 343h10v10h-10zM686 343h10v10h-10zM699 343h10v10h-10zM712 343h10v10h-10zM725 343h10v10h-10zM738 343h10v10h-10zM751 343h10v10h-10zM764 343h10v10h-10zM777 343h10v10h-10zM790 343h10v10h-10zM803 343h10v10h-10zM816 343h10v10h-10zM829 343h10v10h-10z"/>
    <path d="M634 356h10v10h-10zM647 356h10v10h-10zM660 356h10v10h-10zM673 356h10v10h-10zM686 356h10v10h-10zM699 356h10v10h-10zM712 356h10v10h-10zM725 356h10v10h-10zM738 356h10v10h-10zM751 356h10v10h-10zM764 356h10v10h-10zM777 356h10v10h-10zM790 356h10v10h-10zM803 356h10v10h-10zM816 356h10v10h-10zM829 356h10v10h-10z"/>
    <path d="M634 369h10v10h-10zM647 369h10v10h-10zM660 369h10v10h-10zM673 369h10v10h-10zM686 369h10v10h-10zM699 369h10v10h-10zM712 369h10v10h-10zM725 369h10v10h-10zM738 369h10v10h-10zM751 369h10v10h-10zM764 369h10v10h-10zM777 369h10v10h-10zM790 369h10v10h-10zM803 369h10v10h-10zM816 369h10v10h-10zM829 369h10v10h-10z"/>
  </g>
  <g fill="#a78bfa" filter="url(#lit)">
    <rect x="660" y="278" width="10" height="10" rx="2"/><rect x="777" y="291" width="10" height="10" rx="2"/>
    <rect x="699" y="304" width="10" height="10" rx="2"/><rect x="816" y="317" width="10" height="10" rx="2"/>
    <rect x="647" y="330" width="10" height="10" rx="2"/><rect x="738" y="343" width="10" height="10" rx="2"/>
    <rect x="790" y="356" width="10" height="10" rx="2"/><rect x="686" y="369" width="10" height="10" rx="2"/>
  </g>
  <!-- stacked layers -->
  <g fill="none" stroke="#475569">
    <rect x="640" y="398" width="190" height="16" rx="4"/>
    <rect x="646" y="406" width="190" height="16" rx="4"/>
    <rect x="652" y="414" width="190" height="16" rx="4" fill="#1f2937"/>
  </g>
  <text x="747" y="426" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">× 48 layers</text>
  <rect x="632" y="446" width="206" height="34" rx="17" fill="#4c1d95" fill-opacity="0.5" stroke="#a78bfa"/>
  <text x="735" y="469" text-anchor="middle" fill="#ddd6fe" font-size="15" font-weight="700">8 of 128 experts per token</text>
  <text x="735" y="545" text-anchor="middle" fill="#cbd5e1" font-size="15">30.5 B weights, only 3.3 B</text>
  <text x="735" y="563" text-anchor="middle" fill="#cbd5e1" font-size="15">used for each token.</text>

  <!-- Card 4: the file -->
  <g filter="url(#shadow)"><rect x="890" y="248" width="260" height="320" rx="16" fill="url(#card)" stroke="#334155"/></g>
  <rect x="912" y="268" width="216" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="924" y="288" fill="#94a3b8" font-size="13" font-family="Consolas, Menlo, monospace">49 × .safetensors</text>
  <text x="1116" y="288" text-anchor="end" fill="#ffffff" font-size="15" font-weight="800">19.4 GB</text>
  <!-- stacked bar: 14.5 / 3.1 / 1.8 of 19.4, 216 px wide -->
  <rect x="912" y="314" width="161" height="26" rx="4" fill="#ef4444"/>
  <rect x="1074" y="314" width="34" height="26" fill="#22d3ee"/>
  <rect x="1109" y="314" width="19" height="26" rx="3" fill="#d97706"/>
  <g font-size="14" fill="#e2e8f0">
    <rect x="912" y="360" width="12" height="12" rx="3" fill="#ef4444"/><text x="932" y="371">4-bit expert weights</text><text x="1128" y="371" text-anchor="end" font-weight="700">14.5 GB</text>
    <rect x="912" y="388" width="12" height="12" rx="3" fill="#22d3ee"/><text x="932" y="399">16-bit attention, words</text><text x="1128" y="399" text-anchor="end" font-weight="700">3.1 GB</text>
    <rect x="912" y="416" width="12" height="12" rx="3" fill="#d97706"/><text x="932" y="427">scales, 1 per 64</text><text x="1128" y="427" text-anchor="end" font-weight="700">1.8 GB</text>
  </g>
  <rect x="912" y="446" width="216" height="34" rx="17" fill="#0f172a" stroke="#475569"/>
  <text x="1020" y="469" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Consolas, Menlo, monospace">61 GB at 16 bits</text>
  <text x="1020" y="545" text-anchor="middle" fill="#cbd5e1" font-size="15">Same numbers, fewer bits:</text>
  <text x="1020" y="563" text-anchor="middle" fill="#cbd5e1" font-size="15">about 5 per weight.</text>

  <!-- Arrows -->
  <g stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)">
    <path d="M302 408 L326 408"/><path d="M582 408 L606 408"/><path d="M862 408 L886 408"/>
  </g>
</svg>
