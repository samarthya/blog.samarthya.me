<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">ZooKeeper quorum</title>
  <desc id="desc">Three ZooKeeper servers form an ensemble and maintain a quorum.</desc>
  <rect width="900" height="270" rx="18" fill="#f5f3ff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="450" y="40" font-size="22" font-weight="700" fill="#4c1d95">ZooKeeper ensemble</text>
    <circle cx="220" cy="145" r="62" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><text x="220" y="140" font-size="18" font-weight="700" fill="#4c1d95">Server 1</text><text x="220" y="165" font-size="14" fill="#4c1d95">vote</text>
    <circle cx="450" cy="145" r="62" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><text x="450" y="140" font-size="18" font-weight="700" fill="#4c1d95">Server 2</text><text x="450" y="165" font-size="14" fill="#4c1d95">vote</text>
    <circle cx="680" cy="145" r="62" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><text x="680" y="140" font-size="18" font-weight="700" fill="#4c1d95">Server 3</text><text x="680" y="165" font-size="14" fill="#4c1d95">vote</text>
    <path d="M275 125L390 105M510 105L625 125M275 165L390 185M510 185L625 165" stroke="#8b5cf6" stroke-width="3"/>
    <text x="450" y="245" font-size="15" fill="#5b21b6">3 servers: quorum requires 2</text>
  </g>
</svg>
