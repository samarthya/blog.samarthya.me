<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a purple bat holding an envelope, beside transport protocols: TCP (reliable, ordered), UDP (fast, no handshake), Ports (which app), OSI (layer 4)</title>
