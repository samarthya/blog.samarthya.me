<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Kafka JMX monitoring path</title>
  <desc id="desc">A Kafka broker exposes JMX metrics to a collector, which sends them to a dashboard.</desc>
  <rect width="960" height="300" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="95" width="210" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="160" y="135" font-size="24" font-weight="700" fill="#1e3a8a">Kafka broker</text>
    <text x="160" y="165" font-size="16" fill="#1e3a8a">JMX beans</text>
    <rect x="375" y="95" width="210" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="480" y="135" font-size="24" font-weight="700" fill="#14532d">Collector</text>
    <text x="480" y="165" font-size="16" fill="#14532d">scrapes metrics</text>
    <rect x="695" y="95" width="210" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="800" y="135" font-size="24" font-weight="700" fill="#78350f">Dashboard</text>
    <text x="800" y="165" font-size="16" fill="#78350f">trends and alerts</text>
    <path d="M270 145h95M590 145h95" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#475569"/></marker></defs>
</svg>
