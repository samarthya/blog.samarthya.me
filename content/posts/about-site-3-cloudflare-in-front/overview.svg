<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Four kinds of DNS record: the blog DNS-only to GitHub Pages; about proxied through the Cloudflare edge to the old host with Full (strict) TLS; www and the old blog name proxied and answered at the edge with a 301 to the apex; mail DNS-only to the old host. The edge handles TLS, redirect rules and caching.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.62" r="0.5"><stop offset="0" stop-color="#f97316" stop-opacity="0.16"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="78" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">BUILDING ABOUT.SAMARTHYA.ME · 3</text>
  <text x="60" y="132" fill="#ffffff" font-size="50" font-weight="800">Cloudflare in front</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="22">One front desk for the subdomain: records, Full (strict), redirects, cache.</text>
<g filter="url(#shadow)"><rect x="486" y="300" width="208" height="210" rx="22" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="2"/></g>
  <text x="590" y="336" text-anchor="middle" fill="#fdba74" font-size="15" font-weight="800" letter-spacing="2">CLOUDFLARE EDGE</text>
  <text x="590" y="372" text-anchor="middle" fill="#ffffff" font-size="16">TLS for visitors</text>
  <text x="590" y="400" text-anchor="middle" fill="#ffffff" font-size="16">redirect rules</text>
  <text x="590" y="428" text-anchor="middle" fill="#ffffff" font-size="16">cache: HTML 10 min</text>
  <text x="590" y="456" text-anchor="middle" fill="#ffffff" font-size="16">hashed files: days</text>
  <text x="590" y="490" text-anchor="middle" fill="#fdba74" font-size="13" font-family="Consolas, Menlo, monospace">cf-cache-status</text>
  <g filter="url(#shadow)"><rect x="60" y="222" width="330" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="84" y="250" fill="#ffffff" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace">samarthya.me</text><rect x="84" y="258" width="96" height="26" rx="13" fill="#94a3b8" fill-opacity="0.18" stroke="#94a3b8"/><text x="132.0" y="276" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-weight="700">DNS ONLY</text>
  <line x1="390" y1="254" x2="790" y2="254" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <g filter="url(#shadow)"><rect x="800" y="222" width="340" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="824" y="250" fill="#ffffff" font-size="18" font-weight="700">GitHub Pages</text><text x="824" y="272" fill="#94a3b8" font-size="14">the blog</text>
  <g filter="url(#shadow)"><rect x="60" y="310" width="330" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="84" y="338" fill="#ffffff" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace">about</text><rect x="84" y="346" width="96" height="26" rx="13" fill="#f97316" fill-opacity="0.18" stroke="#f97316"/><text x="132.0" y="364" text-anchor="middle" fill="#f97316" font-size="12.5" font-weight="700">PROXIED</text>
  <line x1="390" y1="342" x2="478" y2="342" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="702" y1="342" x2="790" y2="342" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr)"/>
  <g filter="url(#shadow)"><rect x="800" y="310" width="340" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="824" y="338" fill="#ffffff" font-size="18" font-weight="700">old host</text><text x="824" y="360" fill="#94a3b8" font-size="14">FULL (STRICT)</text>
  <g filter="url(#shadow)"><rect x="60" y="398" width="330" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="84" y="426" fill="#ffffff" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace">www · blog</text><rect x="84" y="434" width="96" height="26" rx="13" fill="#f97316" fill-opacity="0.18" stroke="#f97316"/><text x="132.0" y="452" text-anchor="middle" fill="#f97316" font-size="12.5" font-weight="700">PROXIED</text>
  <line x1="390" y1="430" x2="478" y2="430" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="702" y1="430" x2="790" y2="430" stroke="#475569" stroke-width="2" stroke-dasharray="3 6"/><text x="746" y="424" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="800">✕</text>
  <g filter="url(#shadow)"><rect x="800" y="398" width="340" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="824" y="426" fill="#ffffff" font-size="18" font-weight="700">GitHub · 192.0.2.1</text><text x="824" y="448" fill="#94a3b8" font-size="14">never reached: edge sends 301</text>
  <g filter="url(#shadow)"><rect x="60" y="486" width="330" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="84" y="514" fill="#ffffff" font-size="19" font-weight="700" font-family="Consolas, Menlo, monospace">mail · smtp · pop</text><rect x="84" y="522" width="96" height="26" rx="13" fill="#94a3b8" fill-opacity="0.18" stroke="#94a3b8"/><text x="132.0" y="540" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-weight="700">DNS ONLY</text>
  <line x1="390" y1="518" x2="790" y2="518" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <g filter="url(#shadow)"><rect x="800" y="486" width="340" height="64" rx="14" fill="url(#card)" stroke="#334155"/></g><text x="824" y="514" fill="#ffffff" font-size="18" font-weight="700">old host</text><text x="824" y="536" fill="#94a3b8" font-size="14">email</text>
</svg>