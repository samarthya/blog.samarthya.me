<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Kafka security layers</title>
  <desc id="desc">Kafka security uses encryption, authentication, and authorization as separate layers.</desc>
  <rect width="900" height="270" rx="18" fill="#f0fdf4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="75" y="80" width="220" height="110" rx="16" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="185" y="125" font-size="22" font-weight="700" fill="#14532d">Encryption</text><text x="185" y="155" font-size="15" fill="#14532d">Can others read it?</text>
    <rect x="340" y="80" width="220" height="110" rx="16" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="450" y="125" font-size="22" font-weight="700" fill="#1e3a8a">Authentication</text><text x="450" y="155" font-size="15" fill="#1e3a8a">Who are you?</text>
    <rect x="605" y="80" width="220" height="110" rx="16" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><text x="715" y="125" font-size="22" font-weight="700" fill="#7c2d12">Authorization</text><text x="715" y="155" font-size="15" fill="#7c2d12">What may you do?</text>
  </g>
</svg>
