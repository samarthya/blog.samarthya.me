<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Two cards. samarthya.me: 63 old DNS records cut to 11; the blog DNS-only to GitHub Pages; www and the old blog name proxied and redirected with a 301 at the edge (blog via the placeholder 192.0.2.1); about proxied with Full (strict) TLS; mail DNS-only on its own name. bhanuni.in: no server, both names proxied to 192.0.2.1 and sent to the gallery with a 302, SPF -all and DMARC p=reject because it sends no mail, and Always Use HTTPS.</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset=".55" stop-color="#0d1330"/><stop offset="1" stop-color="#1a1440"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6821f"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#f6821f"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
</defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="320" cy="420" r="200" fill="#f6821f" opacity="0.24" filter="url(#blur)"/><circle cx="960" cy="420" r="200" fill="#a78bfa" opacity="0.26" filter="url(#blur)"/><circle cx="1100" cy="80" r="120" fill="#22d3ee" opacity="0.16" filter="url(#blur)"/><rect width="1200" height="630" fill="url(#dots)"/><text x="60" y="76" fill="#f6821f" font-size="17" font-weight="700" letter-spacing="3.5">CLOUDFLARE, PLAINLY · 2</text><text x="60" y="128" fill="#f8fafc" font-size="46" font-weight="800">How it secured my two sites</text><text x="60" y="166" fill="#cbd5e1" font-size="21">samarthya.me and bhanuni.in: what each record and rule is for.</text><g filter="url(#shadow)"><rect x="60" y="210" width="520" height="360" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="60" y="210" width="520" height="360" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><text x="88" y="248" fill="#f8fafc" font-size="22" font-weight="800" text-anchor="start">samarthya.me</text><rect x="420" y="228" width="136" height="26" rx="13" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24" stroke-opacity=".7"/><text x="488.0" y="246" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">63 → 11 records</text><rect x="84" y="268" width="472" height="42" rx="11" fill="#ffffff" fill-opacity=".035"/><path transform="translate(112,288) scale(0.42)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#94a3b8"/><text x="138" y="294" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">@</text><text x="214" y="294" fill="#94a3b8" font-size="13" font-weight="700" text-anchor="start">DNS only</text><text x="306" y="294" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">GitHub Pages</text><text x="540" y="294" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="end">the blog</text><rect x="84" y="322" width="472" height="42" rx="11" fill="#ffffff" fill-opacity=".035"/><path transform="translate(112,342) scale(0.42)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#f6821f"/><text x="138" y="348" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">www</text><text x="214" y="348" fill="#f6821f" font-size="13" font-weight="700" text-anchor="start">proxied</text><text x="306" y="348" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">301 → apex</text><text x="540" y="348" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="end">at the edge</text><rect x="84" y="376" width="472" height="42" rx="11" fill="#ffffff" fill-opacity=".035"/><path transform="translate(112,396) scale(0.42)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#f6821f"/><text x="138" y="402" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">blog</text><text x="214" y="402" fill="#f6821f" font-size="13" font-weight="700" text-anchor="start">proxied</text><text x="306" y="402" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">192.0.2.1</text><text x="540" y="402" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="end">301, old links</text><rect x="84" y="430" width="472" height="42" rx="11" fill="#ffffff" fill-opacity=".035"/><path transform="translate(112,450) scale(0.42)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#f6821f"/><text x="138" y="456" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">about</text><text x="214" y="456" fill="#f6821f" font-size="13" font-weight="700" text-anchor="start">proxied</text><text x="306" y="456" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">Full (strict)</text><text x="540" y="456" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="end">TLS checked twice</text><rect x="84" y="484" width="472" height="42" rx="11" fill="#ffffff" fill-opacity=".035"/><path transform="translate(112,504) scale(0.42)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#94a3b8"/><text x="138" y="510" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">mail</text><text x="214" y="510" fill="#94a3b8" font-size="13" font-weight="700" text-anchor="start">DNS only</text><text x="306" y="510" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">mail host</text><text x="540" y="510" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="end">MX on its own name</text><g filter="url(#shadow)"><rect x="620" y="210" width="520" height="360" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="620" y="210" width="520" height="360" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><text x="648" y="248" fill="#f8fafc" font-size="22" font-weight="800" text-anchor="start">bhanuni.in</text><rect x="1012" y="228" width="104" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-opacity=".7"/><text x="1064.0" y="246" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">no server</text><rect x="648" y="272" width="464" height="112" rx="14" fill="#ffffff" fill-opacity=".035"/><path transform="translate(690,312) scale(0.55)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#f6821f"/><text x="726" y="306" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">@  www  →  192.0.2.1</text><text x="726" y="330" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">proxied placeholder, nothing listens</text><path d="M690 352 C760 372 860 372 930 352" fill="none" stroke="#f6821f" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/><text x="946" y="358" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="start">302 → gallery</text><text x="648" y="422" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">Mail it can never send</text><rect x="648" y="440" width="464" height="32" rx="9" fill="#ffffff" fill-opacity=".035"/><circle cx="668" cy="456" r="9" fill="#4ade80" opacity=".18"/><circle cx="668" cy="456" r="4" fill="#4ade80"/><text x="686" y="461" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">v=spf1 -all</text><rect x="648" y="480" width="464" height="32" rx="9" fill="#ffffff" fill-opacity=".035"/><circle cx="668" cy="496" r="9" fill="#4ade80" opacity=".18"/><circle cx="668" cy="496" r="4" fill="#4ade80"/><text x="686" y="501" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">DMARC p=reject</text><rect x="648" y="520" width="464" height="32" rx="9" fill="#ffffff" fill-opacity=".035"/><circle cx="668" cy="536" r="9" fill="#22d3ee" opacity=".18"/><circle cx="668" cy="536" r="4" fill="#22d3ee"/><text x="686" y="541" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">Always Use HTTPS</text></svg>
