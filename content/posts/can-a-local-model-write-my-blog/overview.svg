<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Three attempts at one blog brief on a local Qwen3-Coder 30B: the Claude Code agent read its 19,545-token prompt for 84 minutes and wrote nothing; a plain request to Colibri wrote 975 words in 9.9 minutes with 12 errors and no warnings; a plain request to Ollama wrote 1,153 words in 13.5 minutes with 10 errors, one warning and a page that breaks the build. A draft page shows sentences underlined in red.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.22"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="redglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="60" y="78" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">LOCAL MODELS · FACT-CHECKED</text>
  <text x="60" y="132" fill="#ffffff" font-size="50" font-weight="800">Can a local 30B model write my blog?</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="22">One brief, three attempts on Qwen3-Coder 30B, every line checked.</text>

  <!-- time axis label -->
  <text x="330" y="222" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="2">MINUTES, 0 TO 90</text>

  <!-- Row 1: agent -->
  <g filter="url(#shadow)"><rect x="50" y="234" width="720" height="104" rx="16" fill="url(#card)" stroke="#334155"/></g>
  <text x="74" y="270" fill="#ffffff" font-size="20" font-weight="800">Agent</text>
  <text x="74" y="294" fill="#94a3b8" font-size="14">Claude Code → Colibri</text>
  <text x="74" y="318" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">19,545-token prompt</text>
  <rect x="330" y="256" width="300" height="16" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="330" y="256" width="280" height="16" rx="8" fill="#ef4444" fill-opacity="0.75"/>
  <text x="330" y="300" fill="#e2e8f0" font-size="15"><tspan font-weight="800">84 min</tspan> reading · <tspan font-weight="800">0 words</tspan></text>
  <rect x="650" y="252" width="100" height="26" rx="13" fill="#7f1d1d" stroke="#ef4444"/>
  <text x="700" y="270" text-anchor="middle" fill="#fecaca" font-size="13" font-weight="800" letter-spacing="1">NO REPLY</text>

  <!-- Row 2: Colibri -->
  <g filter="url(#shadow)"><rect x="50" y="352" width="720" height="104" rx="16" fill="url(#card)" stroke="#334155"/></g>
  <text x="74" y="388" fill="#ffffff" font-size="20" font-weight="800">Colibri</text>
  <text x="74" y="412" fill="#94a3b8" font-size="14">plain request</text>
  <text x="74" y="436" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">2,598-token prompt</text>
  <rect x="330" y="374" width="300" height="16" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="330" y="374" width="33" height="16" rx="8" fill="#22d3ee"/>
  <text x="330" y="418" fill="#e2e8f0" font-size="15"><tspan font-weight="800">9.9 min</tspan> · 975 words · 0 [CHECK]</text>
  <rect x="650" y="370" width="100" height="26" rx="13" fill="#7c2d12" stroke="#f97316"/>
  <text x="700" y="388" text-anchor="middle" fill="#fed7aa" font-size="13" font-weight="800" letter-spacing="1">12 ERRORS</text>
  <text x="700" y="420" text-anchor="middle" fill="#fca5a5" font-size="12">1 fake reference</text>

  <!-- Row 3: Ollama -->
  <g filter="url(#shadow)"><rect x="50" y="470" width="720" height="104" rx="16" fill="url(#card)" stroke="#334155"/></g>
  <text x="74" y="506" fill="#ffffff" font-size="20" font-weight="800">Ollama</text>
  <text x="74" y="530" fill="#94a3b8" font-size="14">plain request</text>
  <text x="74" y="554" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">2,598-token prompt</text>
  <rect x="330" y="492" width="300" height="16" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="330" y="492" width="45" height="16" rx="8" fill="#a78bfa"/>
  <text x="330" y="536" fill="#e2e8f0" font-size="15"><tspan font-weight="800">13.5 min</tspan> · 1,153 words · 1 [CHECK]</text>
  <rect x="650" y="488" width="100" height="26" rx="13" fill="#7c2d12" stroke="#f97316"/>
  <text x="700" y="506" text-anchor="middle" fill="#fed7aa" font-size="13" font-weight="800" letter-spacing="1">10 ERRORS</text>
  <text x="700" y="538" text-anchor="middle" fill="#fca5a5" font-size="12">build fails</text>

  <!-- Draft page with red underlines -->
  <g filter="url(#shadow)">
    <rect x="806" y="234" width="344" height="340" rx="16" fill="#f8fafc"/>
  </g>
  <rect x="806" y="234" width="344" height="40" rx="16" fill="#e2e8f0"/>
  <rect x="806" y="258" width="344" height="16" fill="#e2e8f0"/>
  <text x="828" y="260" fill="#334155" font-size="14" font-weight="700">draft.md</text>
  <text x="1128" y="260" text-anchor="end" fill="#64748b" font-size="12">0 doubts</text>
  <g fill="#cbd5e1">
    <rect x="828" y="296" width="290" height="9" rx="4"/>
    <rect x="828" y="316" width="240" height="9" rx="4"/>
    <rect x="828" y="352" width="300" height="9" rx="4"/>
    <rect x="828" y="372" width="200" height="9" rx="4"/>
    <rect x="828" y="408" width="280" height="9" rx="4"/>
    <rect x="828" y="428" width="260" height="9" rx="4"/>
    <rect x="828" y="464" width="300" height="9" rx="4"/>
    <rect x="828" y="484" width="220" height="9" rx="4"/>
    <rect x="828" y="520" width="270" height="9" rx="4"/>
  </g>
  <g stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#redglow)">
    <path d="M828 324 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
    <path d="M828 380 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
    <path d="M828 436 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
    <path d="M828 528 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
  </g>
  <rect x="1032" y="398" width="96" height="24" rx="12" fill="#ef4444"/>
  <text x="1080" y="415" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">404 LINK</text>
  <text x="828" y="558" fill="#64748b" font-size="13">fluent, confident, unchecked</text>
</svg>
