<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Kimi K2's nine build stages in three rows. Part 1, highlighted: data (15.5T tokens of web, code, maths and knowledge), tokenizer (160K vocabulary, byte pair encoding), architecture (1.04T parameters, Mixture-of-Experts with 32.6B active). Part 2: pre-training (MuonClip, no loss spikes) and long context (4K to 128K), giving a base model. Part 3: fine-tuning (23,000+ tools), reinforcement learning, evaluation (SWE-bench 65.8) and release (block-FP8, about 1 TB, modified MIT).</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.55"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="vglow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#a78bfa" flood-opacity="0.7"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="70" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">HOW AN LLM IS BUILT · 1</text>
  <text x="60" y="120" fill="#ffffff" font-size="46" font-weight="800">Nine stages, one real model</text>
  <text x="60" y="156" fill="#cbd5e1" font-size="21">Kimi K2, from 15.5 trillion tokens of text to downloadable weights</text>
<text x="60" y="210" fill="#a78bfa" font-size="14" font-weight="700" text-anchor="start">PART 1 · THE DATA AND THE DESIGN</text>
  <rect x="60" y="220" width="246" height="92" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="2" filter="url(#vglow)"/>
  <circle cx="86" cy="248" r="14" fill="#a78bfa"/><text x="86" y="253" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">1</text>
  <text x="108" y="254" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Data</text>
  <text x="78" y="282" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">15.5T tokens</text>
  <text x="78" y="302" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">web · code · maths · knowledge</text>
  <line x1="308" y1="266" x2="336" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="338" y="220" width="246" height="92" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="2" filter="url(#vglow)"/>
  <circle cx="364" cy="248" r="14" fill="#a78bfa"/><text x="364" y="253" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">2</text>
  <text x="386" y="254" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Tokenizer</text>
  <text x="356" y="282" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">160K vocabulary</text>
  <text x="356" y="302" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">byte pair encoding</text>
  <line x1="586" y1="266" x2="614" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="616" y="220" width="246" height="92" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="2" filter="url(#vglow)"/>
  <circle cx="642" cy="248" r="14" fill="#a78bfa"/><text x="642" y="253" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">3</text>
  <text x="664" y="254" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Architecture</text>
  <text x="634" y="282" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">1.04T params</text>
  <text x="634" y="302" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">MoE: 32.6B active per token</text>
  <text x="60" y="348" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="start">PART 2 · PRE-TRAINING</text>
  <rect x="60" y="358" width="246" height="92" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="86" cy="386" r="14" fill="#22d3ee"/><text x="86" y="391" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">4</text>
  <text x="108" y="392" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Pre-training</text>
  <text x="78" y="420" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">MuonClip</text>
  <text x="78" y="440" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">next token, 0 loss spikes</text>
  <line x1="308" y1="404" x2="336" y2="404" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="338" y="358" width="246" height="92" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="364" cy="386" r="14" fill="#22d3ee"/><text x="364" y="391" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">5</text>
  <text x="386" y="392" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Long context</text>
  <text x="356" y="420" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">4K → 128K</text>
  <text x="356" y="440" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">anneal, then YaRN</text>
  <line x1="586" y1="404" x2="614" y2="404" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="616" y="380" width="300" height="48" rx="24" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"/>
  <text x="766" y="410" fill="#a5f3fc" font-size="14" font-weight="700" text-anchor="middle">= a BASE MODEL (brilliant autocomplete)</text>
  <text x="60" y="486" fill="#22c55e" font-size="14" font-weight="700" text-anchor="start">PART 3 · FROM BASE MODEL TO ASSISTANT</text>
  <rect x="60" y="496" width="246" height="92" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="86" cy="524" r="14" fill="#22c55e"/><text x="86" y="529" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">6</text>
  <text x="108" y="530" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Fine-tuning</text>
  <text x="78" y="558" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">23,000+ tools</text>
  <text x="78" y="578" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">agent conversations</text>
  <line x1="308" y1="542" x2="336" y2="542" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="338" y="496" width="246" height="92" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="364" cy="524" r="14" fill="#22c55e"/><text x="364" y="529" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">7</text>
  <text x="386" y="530" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">RL</text>
  <text x="356" y="558" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">rewards</text>
  <text x="356" y="578" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">verifiable + self-critique</text>
  <line x1="586" y1="542" x2="614" y2="542" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="616" y="496" width="246" height="92" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="642" cy="524" r="14" fill="#22c55e"/><text x="642" y="529" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">8</text>
  <text x="664" y="530" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Evaluation</text>
  <text x="634" y="558" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">SWE-bench 65.8</text>
  <text x="634" y="578" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">and known weaknesses</text>
  <line x1="864" y1="542" x2="892" y2="542" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="894" y="496" width="246" height="92" rx="14" fill="url(#card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="920" cy="524" r="14" fill="#22c55e"/><text x="920" y="529" fill="#0b1020" font-size="14" font-weight="800" text-anchor="middle">9</text>
  <text x="942" y="530" fill="#ffffff" font-size="18" font-weight="800" text-anchor="start">Release</text>
  <text x="912" y="558" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">block-FP8</text>
  <text x="912" y="578" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">~1 TB, modified MIT</text>
</svg>
