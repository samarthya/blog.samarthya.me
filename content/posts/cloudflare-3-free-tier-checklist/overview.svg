<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Eight tiles for the Cloudflare free plan: unmetered DDoS protection, the free managed WAF ruleset (one ruleset), 5 WAF custom rules, 1 rate-limiting rule per IP over 10 seconds, 10 redirect rules, 10 cache rules, Universal SSL for the apex and one level of subdomains, and Zero Trust for up to 50 users.</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset=".55" stop-color="#0d1330"/><stop offset="1" stop-color="#1a1440"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6821f"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#f6821f"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
</defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="300" cy="460" r="210" fill="#22d3ee" opacity="0.18" filter="url(#blur)"/><circle cx="900" cy="430" r="220" fill="#f6821f" opacity="0.26" filter="url(#blur)"/><circle cx="1110" cy="90" r="120" fill="#a78bfa" opacity="0.2" filter="url(#blur)"/><rect width="1200" height="630" fill="url(#dots)"/><text x="60" y="76" fill="#f6821f" font-size="17" font-weight="700" letter-spacing="3.5">CLOUDFLARE, PLAINLY · 3</text><text x="60" y="128" fill="#f8fafc" font-size="46" font-weight="800">The free tier, and what to do with it</text><text x="60" y="166" fill="#cbd5e1" font-size="21">What $0 a month buys, and the settings worth a Saturday.</text><g filter="url(#shadow)"><rect x="60" y="210" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="60" y="210" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="112" cy="266" r="30" fill="#f6821f" fill-opacity=".14" stroke="#f6821f" stroke-opacity=".6"/><text x="112" y="277" fill="#f6821f" font-size="28" font-weight="800" text-anchor="middle">∞</text><text x="156" y="272" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">DDoS protection</text><text x="84" y="326" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">unmetered, L3–L7</text><g filter="url(#shadow)"><rect x="334" y="210" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="334" y="210" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="386" cy="266" r="30" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".6"/><text x="386" y="277" fill="#f87171" font-size="28" font-weight="800" text-anchor="middle">1</text><text x="430" y="272" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">Managed ruleset</text><text x="358" y="326" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">widely exploited CVEs</text><g filter="url(#shadow)"><rect x="608" y="210" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="608" y="210" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="660" cy="266" r="30" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".6"/><text x="660" y="277" fill="#a78bfa" font-size="28" font-weight="800" text-anchor="middle">5</text><text x="704" y="272" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">WAF custom rules</text><text x="632" y="326" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">block, challenge, skip</text><g filter="url(#shadow)"><rect x="882" y="210" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="882" y="210" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="934" cy="266" r="30" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".6"/><text x="934" y="277" fill="#fbbf24" font-size="28" font-weight="800" text-anchor="middle">1</text><text x="978" y="272" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">Rate-limit rule</text><text x="906" y="326" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">per IP, 10 s window</text><g filter="url(#shadow)"><rect x="60" y="380" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="60" y="380" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="112" cy="436" r="30" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".6"/><text x="112" y="447" fill="#22d3ee" font-size="24" font-weight="800" text-anchor="middle">10</text><text x="156" y="442" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">Redirect rules</text><text x="84" y="496" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">single redirects</text><g filter="url(#shadow)"><rect x="334" y="380" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="334" y="380" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="386" cy="436" r="30" fill="#4ade80" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".6"/><text x="386" y="447" fill="#4ade80" font-size="24" font-weight="800" text-anchor="middle">10</text><text x="430" y="442" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">Cache rules</text><text x="358" y="496" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">HTML too, if you say so</text><g filter="url(#shadow)"><rect x="608" y="380" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="608" y="380" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="660" cy="436" r="30" fill="#4ade80" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".6"/><text x="660" y="447" fill="#4ade80" font-size="28" font-weight="800" text-anchor="middle">✓</text><text x="704" y="442" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">Universal SSL</text><text x="632" y="496" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">apex + one level</text><g filter="url(#shadow)"><rect x="882" y="380" width="250" height="148" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="882" y="380" width="250" height="148" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><circle cx="934" cy="436" r="30" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".6"/><text x="934" y="447" fill="#22d3ee" font-size="24" font-weight="800" text-anchor="middle">50</text><text x="978" y="442" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start">Zero Trust users</text><text x="906" y="496" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start">Access, Tunnel, Gateway</text><text x="60" y="604" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Free plan limits as documented by Cloudflare, November 2026</text></svg>
