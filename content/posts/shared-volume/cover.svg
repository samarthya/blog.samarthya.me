<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a frog holding a parcel marked vol, beside a terminal titled docker volume showing docker volume ls; DRIVER    VOLUME NAME; local     c9ad85b13e22…; docker volume; create    Create a volume; inspect   Display detailed information</title>
