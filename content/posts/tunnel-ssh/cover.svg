<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a dark brown mole with a pink nose, a headlamp and a shovel, beside a terminal with three SSH tunnels: -L forwards a local port to web-server:80, -R opens a remote port back to you, -D starts a SOCKS proxy</title>
  <defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7e5e4"/><stop offset="0.65" stop-color="#f5f5f4"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6d2"/><stop offset="1" stop-color="#fbd1b5"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.6" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#2f7fd6"/><stop offset="1" stop-color="#6fe0e8"/></linearGradient>
<linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa4b5"/><stop offset="0.45" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
<linearGradient id="robot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#b8c4d6"/></linearGradient>
<linearGradient id="qmark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a1d5c" flood-opacity="0.28"/></filter>
<clipPath id="eyeL"><ellipse cx="540" cy="266" rx="38" ry="50"/></clipPath>
<clipPath id="eyeR"><ellipse cx="664" cy="266" rx="38" ry="50"/></clipPath>
<symbol id="spark" viewBox="-10 -10 20 20" overflow="visible"><path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10Z" fill="#ffffff"/></symbol>
</defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <rect x="600" y="150" width="560" height="278" rx="18" fill="#0f172a"/>
    <path d="M600 200 V168 Q600 150 618 150 H1142 Q1160 150 1160 168 V200Z" fill="#1e293b"/>
    <circle cx="628" cy="175" r="7" fill="#ef4444"/><circle cx="650" cy="175" r="7" fill="#f59e0b"/><circle cx="672" cy="175" r="7" fill="#22c55e"/>
    <text x="880.0" y="182" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#94a3b8">tunnels</text>
  </g>
  <text xml:space="preserve" x="626" y="242" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">ssh -L 8080:web-server:80 user@remote-host</tspan></text><text xml:space="preserve" x="626" y="273" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#4ade80">  local port → through the tunnel</text><text xml:space="preserve" x="626" y="304" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">ssh -R 8080:localhost:80 user@remote-host</tspan></text><text xml:space="preserve" x="626" y="335" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#4ade80">  remote port → back to you</text><text xml:space="preserve" x="626" y="366" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">ssh -D 1080 user@remote-server</tspan></text><text xml:space="preserve" x="626" y="397" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#4ade80">  dynamic: a SOCKS proxy</text>
  <g filter="url(#drop)" transform="rotate(0 765.0 88)">
    <rect x="600" y="66" width="330" height="44" rx="22" fill="#57534e"/>
    <text x="765.0" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">SSH tunnels: -L · -R · -D</text>
  </g><defs><linearGradient id="cfur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/></linearGradient><linearGradient id="cbeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="cshine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
  <ellipse cx="270" cy="530" rx="165" ry="140" fill="url(#cfur)" filter="url(#drop)"/><ellipse cx="270" cy="560" rx="105" ry="100" fill="#a8a29e"/>
  
  <ellipse cx="270" cy="290" rx="165" ry="138" fill="url(#cfur)" filter="url(#drop)"/><ellipse cx="230" cy="190" rx="70" ry="28" fill="url(#cshine)" transform="rotate(-15 230 190)"/>
  
  
  <defs><clipPath id="cL"><ellipse cx="212" cy="290" rx="30" ry="36"/></clipPath><linearGradient id="cLg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#57534e"/></linearGradient></defs>
  <ellipse cx="212" cy="290" rx="30" ry="36" fill="#ffffff"/>
  <g clip-path="url(#cL)">
    <ellipse cx="222" cy="288" rx="22.5" ry="27.0" fill="url(#cLg)"/>
    <ellipse cx="222" cy="286" rx="10.125" ry="13.5" fill="#111827"/>
    <circle cx="214.125" cy="277.2" r="7.199999999999999" fill="#ffffff"/>
    <circle cx="229.875" cy="297.45" r="3.0" fill="#ffffff"/>
  </g>
  <ellipse cx="212" cy="290" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <defs><clipPath id="cR"><ellipse cx="328" cy="290" rx="30" ry="36"/></clipPath><linearGradient id="cRg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#57534e"/></linearGradient></defs>
  <ellipse cx="328" cy="290" rx="30" ry="36" fill="#ffffff"/>
  <g clip-path="url(#cR)">
    <ellipse cx="338" cy="288" rx="22.5" ry="27.0" fill="url(#cRg)"/>
    <ellipse cx="338" cy="286" rx="10.125" ry="13.5" fill="#111827"/>
    <circle cx="330.125" cy="277.2" r="7.199999999999999" fill="#ffffff"/>
    <circle cx="345.875" cy="297.45" r="3.0" fill="#ffffff"/>
  </g>
  <ellipse cx="328" cy="290" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <ellipse cx="176" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/><ellipse cx="364" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="270" cy="340" rx="17" ry="12" fill="#f472b6"/><ellipse cx="264" cy="335" rx="6" ry="3.5" fill="#ffffff" opacity="0.6"/>
  <path d="M238 362 C250 396 290 396 302 362Z" fill="#be123c"/><path d="M244 366 L296 366" stroke="#ffffff" stroke-width="6"/>
  <g filter="url(#drop)"><path d="M110 200 C170 150 370 150 430 200" stroke="#f59e0b" stroke-width="18" fill="none"/><circle cx="270" cy="160" r="30" fill="#fde047" stroke="#b45309" stroke-width="6"/><circle cx="270" cy="160" r="14" fill="#ffffff"/></g>
  <path d="M400 500 C430 470 445 440 450 412" stroke="url(#cfur)" stroke-width="48" fill="none" stroke-linecap="round"/>
  <g filter="url(#drop)" transform="rotate(200 450 372)"><rect x="444" y="242" width="12" height="170" rx="5" fill="#92400e"/><path d="M420 412 L480 412 L474 472 C460 492 440 492 426 472Z" fill="#94a3b8" stroke="#475569" stroke-width="4"/><rect x="430" y="230" width="40" height="14" rx="7" fill="#92400e"/></g>
  <circle cx="450" cy="392" r="28" fill="#fbcfe8" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><ellipse cx="200" cy="520" rx="34" ry="26" fill="#fbcfe8" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><use href="#spark" x="40" y="70" width="24" height="24"/><use href="#spark" x="560" y="40" width="18" height="18"/><use href="#spark" x="1165" y="600" width="22" height="22"/>
</svg>
