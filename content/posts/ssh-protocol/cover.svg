<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a hedgehog with brown spikes holds a green padlock, beside a client and a server on port 22 joined by a locked line: the server proves its identity with public-key cryptography, you log in with a password or a public key, and the session is protected with symmetric encryption and hashing</title>
  <defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="0.65" stop-color="#e0f2fe"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6d2"/><stop offset="1" stop-color="#fbd1b5"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.6" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#2f7fd6"/><stop offset="1" stop-color="#6fe0e8"/></linearGradient>
<linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa4b5"/><stop offset="0.45" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
<linearGradient id="robot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#b8c4d6"/></linearGradient>
<linearGradient id="qmark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a1d5c" flood-opacity="0.28"/></filter>
<clipPath id="eyeL"><ellipse cx="540" cy="266" rx="38" ry="50"/></clipPath>
<clipPath id="eyeR"><ellipse cx="664" cy="266" rx="38" ry="50"/></clipPath>
<symbol id="spark" viewBox="-10 -10 20 20" overflow="visible"><path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10Z" fill="#ffffff"/></symbol>
</defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <rect x="600" y="150" width="190" height="96" rx="16" fill="#ffffff" stroke="#0ea5e9" stroke-width="4"/>
    <text x="695" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#1f2937">client</text>
    <text x="695" y="224" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#0369a1">drives the setup</text>
    <rect x="970" y="150" width="190" height="96" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <text x="1065" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#1f2937">server</text>
    <text x="1065" y="224" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#15803d">port 22</text>
  </g>
  <path d="M796 198 H962" stroke="#0f172a" stroke-width="6" stroke-dasharray="4 10" stroke-linecap="round"/>
  <text x="880" y="186" text-anchor="middle" font-size="30">🔒</text>
  
  <g filter="url(#drop)">
    <rect x="600" y="280" width="560" height="300" rx="18" fill="#0f172a"/>
    <path d="M600 330 V298 Q600 280 618 280 H1142 Q1160 280 1160 298 V330Z" fill="#1e293b"/>
    <circle cx="628" cy="305" r="7" fill="#ef4444"/><circle cx="650" cy="305" r="7" fill="#f59e0b"/><circle cx="672" cy="305" r="7" fill="#22c55e"/>
    <text x="880.0" y="312" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#94a3b8">how a session is set up</text>
  </g>
  <text xml:space="preserve" x="626" y="372" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#4ade80">1  server proves who it is</text><text xml:space="preserve" x="626" y="403" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#e2e8f0">   public-key cryptography</text><text xml:space="preserve" x="626" y="434" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#4ade80">2  you log in</text><text xml:space="preserve" x="626" y="465" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#e2e8f0">   password  or  public key ✓</text><text xml:space="preserve" x="626" y="496" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#4ade80">3  everything after is</text><text xml:space="preserve" x="626" y="527" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#e2e8f0">   symmetric encryption + hashing</text>
  <g filter="url(#drop)" transform="rotate(0 741.0 88)">
    <rect x="600" y="66" width="282" height="44" rx="22" fill="#0369a1"/>
    <text x="741.0" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">SSH: the secure shell</text>
  </g><defs><linearGradient id="cfur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7c9a0"/><stop offset="1" stop-color="#b08356"/></linearGradient><linearGradient id="cbeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="cshine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
  <path d="M115 345 L46 342 L103 309Z M103 308 L38 288 L104 270Z M104 269 L47 235 L116 233Z M116 231 L72 186 L139 199Z M140 198 L111 144 L172 173Z M173 172 L162 113 L212 154Z M214 154 L221 95 L256 146Z M258 146 L283 91 L301 148Z M303 148 L345 101 L344 160Z M346 161 L401 125 L382 182Z M383 183 L447 161 L411 212Z M412 213 L481 206 L430 247Z M431 248 L499 258 L438 285Z M438 287 L501 311 L433 324Z M433 325 L486 363 L417 360Z" fill="#78350f" filter="url(#drop)"/>
