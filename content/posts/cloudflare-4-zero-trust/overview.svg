<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Left, castle and moat: a moat around a network where everything inside is trusted, so one stolen VPN login reaches everything. Right, zero trust with Cloudflare One: a person passes Access (a policy and a one-time PIN that expires in 10 minutes), then a Tunnel that only connects outwards, to an app with no open port. Access denies by default; the free plan covers 50 users.</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset=".55" stop-color="#0d1330"/><stop offset="1" stop-color="#1a1440"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6821f"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#f6821f"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
</defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="250" cy="420" r="190" fill="#f87171" opacity="0.16" filter="url(#blur)"/><circle cx="840" cy="400" r="230" fill="#22d3ee" opacity="0.22" filter="url(#blur)"/><circle cx="1080" cy="110" r="130" fill="#f6821f" opacity="0.2" filter="url(#blur)"/><rect width="1200" height="630" fill="url(#dots)"/><text x="60" y="76" fill="#f6821f" font-size="17" font-weight="700" letter-spacing="3.5">CLOUDFLARE, PLAINLY · 4</text><text x="60" y="128" fill="#f8fafc" font-size="46" font-weight="800">An introduction to zero trust</text><text x="60" y="166" fill="#cbd5e1" font-size="21">Stop trusting the network. Check the person, every request.</text><g filter="url(#shadow)"><rect x="60" y="210" width="360" height="360" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="60" y="210" width="360" height="360" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><text x="240" y="246" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2.5">CASTLE AND MOAT</text><circle cx="240" cy="380" r="104" fill="none" stroke="#38bdf8" stroke-opacity=".5" stroke-width="10"/><circle cx="240" cy="380" r="72" fill="#f87171" fill-opacity=".08" stroke="#f87171" stroke-opacity=".5" stroke-dasharray="4 6"/><rect x="200" y="350" width="28" height="20" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.6"/><rect x="248" y="346" width="28" height="20" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.6"/><rect x="222" y="394" width="28" height="20" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.6"/><text x="240" y="520" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">inside = trusted</text><text x="240" y="544" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle">one stolen VPN login reaches all</text><g filter="url(#shadow)"><rect x="450" y="210" width="690" height="360" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="450" y="210" width="690" height="360" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><text x="795" y="246" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2.5">ZERO TRUST WITH CLOUDFLARE ONE</text><circle cx="530" cy="350" r="44" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/><text x="530" y="356" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle">person</text><text x="530" y="424" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="middle">you@example.com</text><path d="M578 350 C610 330 640 330 672 350" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/><circle cx="720" cy="350" r="44" fill="#f6821f" fill-opacity=".12" stroke="#f6821f" stroke-width="2" filter="url(#glow)"/><text x="720" y="356" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle">Access</text><text x="720" y="424" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="middle">policy + OTP</text><path d="M768 350 C800 330 830 330 862 350" fill="none" stroke="#f6821f" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/><circle cx="910" cy="350" r="44" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/><text x="910" y="356" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle">Tunnel</text><text x="910" y="424" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="middle">outbound only</text><path d="M958 350 C990 342 990 342 1022 350" fill="none" stroke="#a78bfa" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/><circle cx="1070" cy="350" r="44" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-width="2" filter="url(#glow)"/><text x="1070" y="356" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle">app</text><text x="1070" y="424" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="middle">no open port</text><rect x="478" y="460" width="634" height="84" rx="14" fill="#ffffff" fill-opacity=".035"/><text x="500" y="492" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">Include: emails ending @example.com</text><text x="500" y="520" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">deny by default · PIN expires in 10 min</text><rect x="980" y="476" width="116" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-opacity=".7"/><text x="1038.0" y="494" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">free: 50 users</text></svg>
