<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a cheerful pink octopus wearing a headset holds a different tool in each arm, a magnifying glass, a calculator, a weather cloud, a database and a wrench, beside the agent loop goal, model, tool call, result, repeat until done, with a red human approves gate and a get_weather London tool call</title>
