    <rect x="620" y="336" width="54" height="16" rx="5" fill="#cbd5e1"/><rect x="620" y="378" width="54" height="16" rx="5" fill="#cbd5e1"/>
    <text x="566" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff">MCP</text>
    <path d="M470 366 C420 366 380 400 340 420" stroke="#7c3aed" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="500" cy="404" r="28" fill="url(#yskin)" stroke="#d99b7a" stroke-width="2.5"/>
  <!-- sparks where the plug meets the hub -->
  <path d="M676 228 L700 214 M690 260 L716 262 M664 196 L672 172" stroke="#facc15" stroke-width="6" stroke-linecap="round"/><use href="#spark" x="40" y="70" width="24" height="24"/><use href="#spark" x="470" y="90" width="20" height="20"/><use href="#spark" x="1160" y="600" width="22" height="22"/><use href="#spark" x="1040" y="580" width="16" height="16"/>
</svg>
