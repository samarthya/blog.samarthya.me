<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Two lanes. Top: a browser asks for bhanuni.in; Cloudflare answers for the proxied placeholder 192.0.2.1 and a redirect rule returns 302 to samarthya.me/bhanuni/ on GitHub Pages. Bottom: a drawing photo goes through the importer: random id, EXIF and GPS removed, rotation fixed, resized to 1800 px, then published as WebP; 42 drawings imported, 2 had GPS removed.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="redglow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Heading -->
  <text x="60" y="74" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">A DOMAIN FOR HER ART</text>
  <text x="60" y="126" fill="#ffffff" font-size="50" font-weight="800">bhanuni.in → her gallery</text>
  <text x="60" y="164" fill="#cbd5e1" font-size="22">One redirect rule, no server. Every picture cleaned before it goes up.</text>

  <!-- Lane labels -->
  <text x="60" y="222" fill="#a78bfa" font-size="15" font-weight="700" letter-spacing="2">THE REDIRECT</text>
  <text x="60" y="440" fill="#a78bfa" font-size="15" font-weight="700" letter-spacing="2">EVERY DRAWING</text>

  <!-- Lane 1: browser -->
  <g filter="url(#shadow)">
    <rect x="60" y="238" width="220" height="140" rx="14" fill="url(#card)" stroke="#334155"/>
  </g>
  <circle cx="82" cy="258" r="5" fill="#ef4444"/><circle cx="98" cy="258" r="5" fill="#f59e0b"/><circle cx="114" cy="258" r="5" fill="#22c55e"/>
  <rect x="76" y="274" width="188" height="32" rx="8" fill="#0b1020" stroke="#334155"/>
  <text x="90" y="296" fill="#e2e8f0" font-size="17" font-family="Consolas, Menlo, monospace">bhanuni.in</text>
  <text x="76" y="334" fill="#94a3b8" font-size="15">DNS answers:</text>
  <text x="76" y="358" fill="#22d3ee" font-size="15" font-family="Consolas, Menlo, monospace">104.x / 172.x</text>

  <line x1="282" y1="308" x2="330" y2="308" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Lane 1: Cloudflare -->
  <g filter="url(#shadow)">
    <rect x="334" y="238" width="380" height="140" rx="14" fill="url(#card)" stroke="#f97316"/>
  </g>
  <text x="354" y="266" fill="#fdba74" font-size="17" font-weight="800">Cloudflare (free plan)</text>
  <g font-size="14" font-family="Consolas, Menlo, monospace" fill="#e2e8f0">
    <text x="354" y="294">A  @    192.0.2.1</text>
    <text x="354" y="316">A  www  192.0.2.1</text>
  </g>
  <rect x="562" y="281" width="132" height="22" rx="11" fill="#f97316" fill-opacity="0.2" stroke="#f97316"/>
  <text x="628" y="297" fill="#fdba74" font-size="13" font-weight="700" text-anchor="middle">PROXIED · TEST-NET</text>
  <text x="354" y="346" fill="#cbd5e1" font-size="15">Rule: all requests →</text>
  <rect x="502" y="331" width="54" height="24" rx="12" fill="#a78bfa"/>
  <text x="529" y="348" fill="#1e1b4b" font-size="14" font-weight="800" text-anchor="middle">302</text>
  <text x="566" y="347" fill="#cbd5e1" font-size="14">+ HTTPS</text>
  <text x="354" y="368" fill="#94a3b8" font-size="13">SPF -all · DMARC p=reject</text>

  <line x1="716" y1="308" x2="764" y2="308" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Lane 1: gallery -->
  <g filter="url(#shadow)">
    <rect x="768" y="238" width="372" height="140" rx="14" fill="url(#card)" stroke="#22c55e"/>
  </g>
  <text x="788" y="266" fill="#86efac" font-size="17" font-weight="800">samarthya.me/bhanuni/</text>
  <text x="788" y="290" fill="#cbd5e1" font-size="15">same Hugo build · GitHub Pages</text>
  <!-- tiny polaroids -->
  <g transform="translate(800 304) rotate(-7)"><rect width="56" height="62" rx="3" fill="#fff"/><rect x="5" y="5" width="46" height="40" fill="#fde68a"/><circle cx="28" cy="25" r="10" fill="#f97316"/></g>
  <g transform="translate(860 300) rotate(2)"><rect width="56" height="62" rx="3" fill="#fff"/><rect x="5" y="5" width="46" height="40" fill="#bfdbfe"/><path d="M12 42 l16 -22 l16 22 z" fill="#a78bfa"/></g>
  <g transform="translate(922 304) rotate(8)"><rect width="56" height="62" rx="3" fill="#fff"/><rect x="5" y="5" width="46" height="40" fill="#bbf7d0"/><circle cx="20" cy="22" r="7" fill="#ef4444"/><circle cx="36" cy="28" r="7" fill="#3b82f6"/></g>
  <text x="1000" y="332" fill="#e2e8f0" font-size="15" font-weight="700">noindex</text>
  <text x="1000" y="354" fill="#94a3b8" font-size="13">no sitemap · no RSS</text>

  <!-- Lane 2: pipeline -->
  <g font-size="15">
    <!-- photo with GPS -->
    <g filter="url(#shadow)"><rect x="60" y="456" width="180" height="120" rx="14" fill="url(#card)" stroke="#334155"/></g>
    <text x="78" y="484" fill="#e2e8f0" font-weight="700">IMG_1234.JPG</text>
    <text x="78" y="508" fill="#94a3b8" font-size="13">camera · time</text>
    <rect x="78" y="520" width="138" height="26" rx="13" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" filter="url(#redglow)"/>
    <text x="147" y="538" fill="#fca5a5" font-size="13" font-weight="800" text-anchor="middle">GPS 📍 home</text>
    <text x="78" y="566" fill="#94a3b8" font-size="12">as it comes off the phone</text>

    <line x1="242" y1="516" x2="282" y2="516" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- importer steps -->
    <g filter="url(#shadow)"><rect x="286" y="456" width="590" height="120" rx="14" fill="url(#card)" stroke="#a78bfa"/></g>
    <text x="306" y="482" fill="#c4b5fd" font-size="16" font-weight="800">import_art.py</text>
    <g font-size="14" fill="#e2e8f0">
      <rect x="306" y="496" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#64748b"/>
      <text x="372" y="516" text-anchor="middle">random id</text>
      <rect x="448" y="496" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#64748b"/>
      <text x="514" y="516" text-anchor="middle">strip EXIF+GPS</text>
      <rect x="590" y="496" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#64748b"/>
      <text x="656" y="516" text-anchor="middle">fix rotation</text>
      <rect x="732" y="496" width="124" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#64748b"/>
      <text x="794" y="516" text-anchor="middle">≤ 1800 px</text>
    </g>
    <text x="306" y="556" fill="#94a3b8" font-size="13">original names stay on this PC (git-ignored) · privacy check before commit</text>

    <line x1="878" y1="516" x2="918" y2="516" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- result -->
    <g filter="url(#shadow)"><rect x="922" y="456" width="218" height="120" rx="14" fill="url(#card)" stroke="#22c55e"/></g>
    <text x="942" y="484" fill="#e2e8f0" font-weight="700" font-family="Consolas, Menlo, monospace">8xms7k.webp</text>
    <text x="942" y="508" fill="#86efac" font-size="13" font-weight="700">no metadata</text>
    <text x="942" y="540" fill="#ffffff" font-size="26" font-weight="800">42</text>
    <text x="980" y="540" fill="#cbd5e1" font-size="14">drawings</text>
    <text x="942" y="564" fill="#fca5a5" font-size="14" font-weight="700">2 had GPS: removed</text>
  </g>
</svg>
