    <text x="630" y="561" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#1f2937">Install + hold</text>
    <text x="1142" y="561" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#6366f1">kubeadm kubectl</text>
  </g>
  <g filter="url(#drop)" transform="rotate(0 817.5 88)">
