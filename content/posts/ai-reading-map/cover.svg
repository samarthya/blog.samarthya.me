<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a panda hiker in a yellow bucket hat with a green backpack, a walking stick and a scroll map stands at the start of a winding trail with four flagged stops: 1 how machines learn, 2 how language models work, 3 building with models, 4 letting models act, and a bookcase labelled data shelf</title>
