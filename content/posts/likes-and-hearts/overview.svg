<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"><title>Two pages on GitHub Pages, a blog post with like, dislike and heart buttons and the gallery with a heart per drawing, send one-tap requests to a small Cloudflare Worker. The Worker checks that the request comes from my site, that the post or drawing exists and that the reaction is like, dislike or heart, then does one upsert into D1, which has two tables: hearts (id, n) and reactions (slug, kind, n). No names or IP addresses are stored; the free plan allows 100,000 writes a day.</title><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset=".55" stop-color="#0d1330"/><stop offset="1" stop-color="#1a1440"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6821f"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#f6821f"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
</defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="250" cy="450" r="190" fill="#a78bfa" opacity="0.22" filter="url(#blur)"/><circle cx="640" cy="400" r="200" fill="#f6821f" opacity="0.26" filter="url(#blur)"/><circle cx="1060" cy="430" r="190" fill="#22d3ee" opacity="0.2" filter="url(#blur)"/><rect width="1200" height="630" fill="url(#dots)"/><text x="60" y="76" fill="#f6821f" font-size="17" font-weight="700" letter-spacing="3.5">STATIC SITE · INTERACTIVE</text><text x="60" y="128" fill="#f8fafc" font-size="46" font-weight="800">Likes and hearts</text><text x="60" y="166" fill="#cbd5e1" font-size="21">One tap, no login, nothing personal kept.</text><g filter="url(#shadow)"><rect x="60" y="206" width="300" height="176" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="60" y="206" width="300" height="176" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><text x="84" y="238" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.5">BLOG POST</text><rect x="84" y="254" width="230" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/><rect x="84" y="270" width="180" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/><rect x="84" y="286" width="130" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/><text x="84" y="322" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">Was this useful?</text><rect x="84" y="334" width="72" height="30" rx="15" fill="none" stroke="#cbd5e1" stroke-opacity=".45"/><text x="108" y="354" fill="#f8fafc" font-size="15" font-weight="400" text-anchor="middle">👍</text><text x="134" y="354" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">3</text><rect x="166" y="334" width="72" height="30" rx="15" fill="none" stroke="#cbd5e1" stroke-opacity=".45"/><text x="190" y="354" fill="#f8fafc" font-size="15" font-weight="400" text-anchor="middle">👎</text><text x="216" y="354" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">0</text><rect x="248" y="334" width="72" height="30" rx="15" fill="none" stroke="#cbd5e1" stroke-opacity=".45"/><text x="272" y="354" fill="#f8fafc" font-size="15" font-weight="400" text-anchor="middle">❤️</text><text x="298" y="354" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">5</text><g filter="url(#shadow)"><rect x="60" y="400" width="300" height="176" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="60" y="400" width="300" height="176" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><text x="84" y="432" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.5">GALLERY</text><rect x="84" y="446" width="76" height="70" rx="10" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><circle cx="122" cy="474" r="14" fill="none" stroke="#cbd5e1" stroke-opacity=".5"/><text x="122" y="540" fill="#f472b6" font-size="14" font-weight="700" text-anchor="middle">♥ 4</text><rect x="170" y="446" width="76" height="70" rx="10" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><circle cx="208" cy="474" r="14" fill="none" stroke="#cbd5e1" stroke-opacity=".5"/><text x="208" y="540" fill="#f472b6" font-size="14" font-weight="700" text-anchor="middle">♥ 1</text><rect x="256" y="446" width="76" height="70" rx="10" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><circle cx="294" cy="474" r="14" fill="none" stroke="#cbd5e1" stroke-opacity=".5"/><text x="294" y="540" fill="#f472b6" font-size="14" font-weight="700" text-anchor="middle">♥ 2</text><text x="84" y="562" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">GitHub Pages: static files</text><circle cx="640" cy="390" r="112" fill="#f6821f" opacity=".08"/><g filter="url(#shadow)"><rect x="500" y="250" width="280" height="280" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="500" y="250" width="280" height="280" rx="18" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.4"/><path transform="translate(640,290) scale(0.7)" d="M-34 14 H34 A16 16 0 0 0 30 -17 A24 24 0 0 0 -12 -22 A18 18 0 0 0 -38 -4 A15 15 0 0 0 -34 14 Z" fill="#f6821f"/><text x="640" y="334" fill="#f8fafc" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="4">WORKER</text><text x="640" y="356" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">a tiny counter</text><rect x="522" y="384" width="236" height="28" rx="9" fill="#ffffff" fill-opacity=".04"/><circle cx="540" cy="398" r="9" fill="#4ade80" opacity=".18"/><circle cx="540" cy="398" r="4" fill="#4ade80"/><text x="556" y="403" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">from my site?</text><rect x="522" y="420" width="236" height="28" rx="9" fill="#ffffff" fill-opacity=".04"/><circle cx="540" cy="434" r="9" fill="#4ade80" opacity=".18"/><circle cx="540" cy="434" r="4" fill="#4ade80"/><text x="556" y="439" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">post or drawing exists?</text><rect x="522" y="456" width="236" height="28" rx="9" fill="#ffffff" fill-opacity=".04"/><circle cx="540" cy="470" r="9" fill="#4ade80" opacity=".18"/><circle cx="540" cy="470" r="4" fill="#4ade80"/><text x="556" y="475" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">like · dislike · heart?</text><text x="640" y="510" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">else refused</text><path d="M362 294 C430 294 440 340 498 352" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/><path d="M362 488 C430 488 440 440 498 428" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/><text x="430" y="400" fill="#f6821f" font-size="13" font-weight="700" text-anchor="middle">one tap</text><g filter="url(#shadow)"><rect x="870" y="206" width="270" height="370" rx="18" fill="#0b1124" fill-opacity=".72"/></g><rect x="870" y="206" width="270" height="370" rx="18" fill="url(#glass)" stroke="url(#hair)" stroke-width="1.4"/><ellipse cx="1005" cy="246" rx="58" ry="14" fill="none" stroke="#22d3ee" stroke-width="2"/><path d="M947 246 V282 A58 14 0 0 0 1063 282 V246" fill="none" stroke="#22d3ee" stroke-width="2"/><text x="1005" y="314" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">D1</text><rect x="892" y="330" width="226" height="66" rx="10" fill="#ffffff" fill-opacity=".04"/><text x="906" y="354" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">hearts</text><text x="906" y="380" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">id · n</text><rect x="892" y="406" width="226" height="66" rx="10" fill="#ffffff" fill-opacity=".04"/><text x="906" y="430" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, monospace">reactions</text><text x="906" y="456" fill="#cbd5e1" font-size="14" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">slug · kind · n</text><rect x="892" y="486" width="226" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-opacity=".7"/><text x="1005.0" y="504" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">no names · no IPs</text><text x="1005" y="548" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="middle">free: 100k writes / day</text><path d="M784 392 C816 380 840 380 872 392" fill="none" stroke="#f6821f" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/><text x="828" y="368" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, monospace">upsert</text></svg>
