  <text xml:space="preserve" x="626" y="242" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">docker network COMMAND</tspan></text><text xml:space="preserve" x="626" y="273" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fbbf24">  connect     Connect a container</text><text xml:space="preserve" x="626" y="304" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fbbf24">  create      Create a network</text><text xml:space="preserve" x="626" y="335" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fbbf24">  disconnect  Disconnect a container</text><text xml:space="preserve" x="626" y="366" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fbbf24">  inspect     Display details</text><text xml:space="preserve" x="626" y="397" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fbbf24">  ls          List networks</text><text xml:space="preserve" x="626" y="428" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fbbf24">  rm          Remove networks</text>
