<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a chick holding a plug marked net, beside a terminal titled docker network showing docker network COMMAND; connect     Connect a container; create      Create a network; disconnect  Disconnect a container; inspect     Display details; ls          List networks; rm          Remove ne</title>
