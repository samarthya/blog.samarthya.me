<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Scanning with OSV-Scanner: five chosen dependencies resolve to 68 packages; 11 are affected by 49 known vulnerabilities, most of them transitive through Express</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="redglow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <text x="60" y="78" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">LEARNING OSV · 2</text>
  <text x="60" y="132" fill="#ffffff" font-size="50" font-weight="800">Scanning a project</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="22">I chose 5 packages. The lockfile brought 68.</text>

  <!-- Terminal -->
  <g transform="translate(60,212)" filter="url(#shadow)">
    <rect width="440" height="118" rx="14" fill="url(#term)" stroke="#334155"/>
    <circle cx="22" cy="22" r="5.5" fill="#ef4444"/><circle cx="40" cy="22" r="5.5" fill="#f59e0b"/><circle cx="58" cy="22" r="5.5" fill="#22c55e"/>
    <g font-family="Consolas, Menlo, monospace" font-size="16">
      <text x="22" y="62" fill="#22d3ee">$</text><text x="40" y="62" fill="#e2e8f0">osv-scanner scan source -r .</text>
      <text x="22" y="92" fill="#fca5a5">49 known vulnerabilities</text><text x="262" y="92" fill="#94a3b8">· exit 1</text>
    </g>
  </g>

  <!-- Funnel of numbers -->
  <g font-weight="800">
    <g transform="translate(60,362)">
      <rect width="440" height="44" rx="10" fill="#ffffff" fill-opacity="0.05"/>
      <rect width="48" height="44" rx="10" fill="#64748b"/>
      <text x="24" y="30" text-anchor="middle" fill="#fff" font-size="22">5</text><text x="64" y="29" fill="#cbd5e1" font-size="17" font-weight="600">dependencies I chose</text>
    </g>
    <g transform="translate(60,414)">
      <rect width="440" height="44" rx="10" fill="#ffffff" fill-opacity="0.05"/>
      <rect width="440" height="44" rx="10" fill="#22d3ee" fill-opacity="0.18"/>
      <text x="16" y="30" fill="#fff" font-size="22">68</text><text x="64" y="29" fill="#cbd5e1" font-size="17" font-weight="600">packages in the lockfile</text>
    </g>
    <g transform="translate(60,466)">
      <rect width="440" height="44" rx="10" fill="#ffffff" fill-opacity="0.05"/>
      <rect width="72" height="44" rx="10" fill="#ef4444" fill-opacity="0.55"/>
      <text x="16" y="30" fill="#fff" font-size="22">11</text><text x="88" y="29" fill="#cbd5e1" font-size="17" font-weight="600">affected · 6 of them transitive</text>
    </g>
    <g transform="translate(60,518)">
      <rect width="440" height="44" rx="10" fill="#ffffff" fill-opacity="0.05"/>
      <rect width="316" height="44" rx="10" fill="#dc2626" fill-opacity="0.75"/>
      <text x="16" y="30" fill="#fff" font-size="22">49</text><text x="64" y="29" fill="#fff" font-size="17" font-weight="600">known vulnerabilities</text>
    </g>
  </g>

  <!-- Dependency tree -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <!-- root to direct -->
    <path d="M855 238 C855 262, 612 262, 612 292"/>
    <path d="M855 238 C855 262, 722 262, 722 292"/>
    <path d="M855 238 L855 292"/>
    <path d="M855 238 C855 262, 988 262, 988 292"/>
    <path d="M855 238 C855 262, 1098 262, 1098 292"/>
    <!-- express to its transitive deps -->
    <g stroke="#ef4444" stroke-opacity="0.7">
      <path d="M612 326 C612 360, 600 370, 600 398"/>
      <path d="M612 326 C612 360, 710 370, 710 398"/>
      <path d="M612 326 C612 360, 820 370, 820 398"/>
      <path d="M612 326 C612 380, 600 430, 600 452"/>
      <path d="M612 326 C612 380, 710 430, 710 452"/>
      <path d="M612 326 C612 380, 820 430, 820 452"/>
    </g>
    <!-- other direct deps to clean packages -->
    <path d="M722 326 C722 360, 905 350, 930 498"/>
    <path d="M855 326 C855 360, 960 360, 990 498"/>
    <path d="M988 326 C988 400, 1050 430, 1050 500"/>
    <path d="M1098 326 C1098 400, 1110 440, 1110 500"/>
  </g>

  <!-- scan beam -->
  <rect x="545" y="365" width="620" height="120" fill="url(#beam)"/>
  <line x1="545" y1="425" x2="1165" y2="425" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- root -->
  <g transform="translate(800,204)">
    <rect width="110" height="34" rx="17" fill="#1e293b" stroke="#94a3b8"/>
    <text x="55" y="23" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">my-app</text>
  </g>

  <!-- direct deps (all 5 affected) -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#fff">
    <g transform="translate(562,292)" filter="url(#redglow)"><rect width="100" height="34" rx="9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/><text x="50" y="22">express</text></g>
    <g transform="translate(672,292)" filter="url(#redglow)"><rect width="100" height="34" rx="9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/><text x="50" y="22">lodash</text></g>
    <g transform="translate(805,292)" filter="url(#redglow)"><rect width="100" height="34" rx="9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/><text x="50" y="22">axios</text></g>
    <g transform="translate(932,292)" filter="url(#redglow)"><rect width="112" height="34" rx="9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/><text x="56" y="22">jsonwebtoken</text></g>
    <g transform="translate(1054,292)" filter="url(#redglow)"><rect width="96" height="34" rx="9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/><text x="48" y="22">minimist</text></g>
  </g>
  <text x="1102" y="344" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">dev</text>

  <!-- transitive affected, via express -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fee2e2">
    <g transform="translate(550,398)" filter="url(#redglow)"><rect width="100" height="30" rx="8" fill="#450a0a" stroke="#ef4444"/><text x="50" y="20">body-parser</text></g>
    <g transform="translate(660,398)" filter="url(#redglow)"><rect width="100" height="30" rx="8" fill="#450a0a" stroke="#ef4444"/><text x="50" y="20">qs</text></g>
    <g transform="translate(770,398)" filter="url(#redglow)"><rect width="100" height="30" rx="8" fill="#450a0a" stroke="#ef4444"/><text x="50" y="20">cookie</text></g>
    <g transform="translate(550,452)" filter="url(#redglow)"><rect width="100" height="30" rx="8" fill="#450a0a" stroke="#ef4444"/><text x="50" y="20">send</text></g>
    <g transform="translate(660,452)" filter="url(#redglow)"><rect width="100" height="30" rx="8" fill="#450a0a" stroke="#ef4444"/><text x="50" y="20">serve-static</text></g>
    <g transform="translate(770,452)" filter="url(#redglow)"><rect width="100" height="30" rx="8" fill="#450a0a" stroke="#ef4444"/><text x="50" y="20">path-to-regexp</text></g>
  </g>
  <text x="710" y="512" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="600">pinned exactly by express 4.17.1</text>

  <!-- clean packages: a cloud of the other 57 -->
  <g fill="#334155" stroke="#64748b" stroke-width="1">
    <circle cx="900" cy="505" r="6"/><circle cx="918" cy="505" r="6"/><circle cx="936" cy="505" r="6"/><circle cx="954" cy="505" r="6"/><circle cx="972" cy="505" r="6"/><circle cx="990" cy="505" r="6"/><circle cx="1008" cy="505" r="6"/><circle cx="1026" cy="505" r="6"/><circle cx="1044" cy="505" r="6"/><circle cx="1062" cy="505" r="6"/><circle cx="1080" cy="505" r="6"/><circle cx="1098" cy="505" r="6"/><circle cx="1116" cy="505" r="6"/><circle cx="1134" cy="505" r="6"/>
    <circle cx="909" cy="522" r="6"/><circle cx="927" cy="522" r="6"/><circle cx="945" cy="522" r="6"/><circle cx="963" cy="522" r="6"/><circle cx="981" cy="522" r="6"/><circle cx="999" cy="522" r="6"/><circle cx="1017" cy="522" r="6"/><circle cx="1035" cy="522" r="6"/><circle cx="1053" cy="522" r="6"/><circle cx="1071" cy="522" r="6"/><circle cx="1089" cy="522" r="6"/><circle cx="1107" cy="522" r="6"/><circle cx="1125" cy="522" r="6"/><circle cx="1143" cy="522" r="6"/>
    <circle cx="900" cy="539" r="6"/><circle cx="918" cy="539" r="6"/><circle cx="936" cy="539" r="6"/><circle cx="954" cy="539" r="6"/><circle cx="972" cy="539" r="6"/><circle cx="990" cy="539" r="6"/><circle cx="1008" cy="539" r="6"/><circle cx="1026" cy="539" r="6"/><circle cx="1044" cy="539" r="6"/><circle cx="1062" cy="539" r="6"/><circle cx="1080" cy="539" r="6"/><circle cx="1098" cy="539" r="6"/><circle cx="1116" cy="539" r="6"/><circle cx="1134" cy="539" r="6"/>
    <circle cx="909" cy="556" r="6"/><circle cx="927" cy="556" r="6"/><circle cx="945" cy="556" r="6"/><circle cx="963" cy="556" r="6"/><circle cx="981" cy="556" r="6"/><circle cx="999" cy="556" r="6"/><circle cx="1017" cy="556" r="6"/><circle cx="1035" cy="556" r="6"/><circle cx="1053" cy="556" r="6"/><circle cx="1071" cy="556" r="6"/><circle cx="1089" cy="556" r="6"/><circle cx="1107" cy="556" r="6"/><circle cx="1125" cy="556" r="6"/><circle cx="1143" cy="556" r="6"/>
    <circle cx="1017" cy="573" r="6"/>
  </g>
  <text x="1020" y="600" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">57 more packages, no known issues</text>
</svg>
