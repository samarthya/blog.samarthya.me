<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Two lanes: as shipped, the cleaner compares a float st_mtime with a date string, which is never equal, so every file is skipped and nothing is touched; after the one-line fix, dry-run moves 3 of 5 files, deleting the keeper first leaves 0 copies, a protected file is moved anyway, and only restore works</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <radialGradient id="glow" cx="0.7" cy="0.6" r="0.5"><stop offset="0" stop-color="#dc2626" stop-opacity="0.35"/><stop offset="1" stop-color="#dc2626" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
    <filter id="redglow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#ef4444" flood-opacity="0.75"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="56" y="70" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#fca5a5">TESTING CODE AN AI WROTE · 3</text>
  <text x="56" y="124" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">One fix away from disaster</text>
  <text x="56" y="160" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">The bug that makes the cleaner do nothing hides three that make it unsafe</text>
<rect x="56" y="196" width="1088" height="150" rx="14" fill="#111827" stroke="#334155" stroke-width="2" filter="url(#sh)"/><text x="80" y="230" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#94a3b8" text-anchor="start" xml:space="preserve">AS SHIPPED</text><rect x="80" y="248" width="330" height="76" rx="14" fill="#1f2937" stroke="#334155" stroke-width="2" filter="url(#sh)"/><text x="100" y="278" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">stat.st_mtime  !=</text><text x="100" y="306" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#d97706" text-anchor="start" xml:space="preserve">"2026-11-07T19:53:54"</text><text x="470" y="293" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">float ≠ str → always True</text><path d="M418 286 L460 286" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><path d="M740 286 L790 286" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="800" y="248" width="320" height="76" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/><text x="960" y="282" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">every file skipped</text><text x="960" y="308" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" xml:space="preserve">0 files touched · looks safe</text><text x="80" y="386" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fca5a5" text-anchor="start" xml:space="preserve">AFTER THE ONE-LINE FIX (compare like with like)</text><rect x="56" y="404" width="260" height="150" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2.5" filter="url(#redglow)"/><text x="76" y="442" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">--mode dry-run</text><text x="76" y="492" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">3 of 5 files moved</text><rect x="76" y="512" width="96" height="28" rx="14" fill="#ef4444"/><text x="124.0" y="531.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">UNSAFE</text><rect x="332" y="404" width="260" height="150" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2.5" filter="url(#redglow)"/><text x="352" y="442" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">keeper deleted first</text><text x="352" y="492" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">0 copies left</text><rect x="352" y="512" width="96" height="28" rx="14" fill="#ef4444"/><text x="400.0" y="531.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">UNSAFE</text><rect x="608" y="404" width="260" height="150" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2.5" filter="url(#redglow)"/><text x="628" y="442" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">--protect b.txt</text><text x="628" y="492" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">b.txt moved anyway</text><rect x="628" y="512" width="96" height="28" rx="14" fill="#ef4444"/><text x="676.0" y="531.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">UNSAFE</text><rect x="884" y="404" width="260" height="150" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2.5" /><text x="904" y="442" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">restore</text><text x="904" y="492" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">every file back</text><rect x="904" y="512" width="70" height="28" rx="14" fill="#22c55e"/><text x="939.0" y="531.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">OK</text><text x="600" y="598" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#94a3b8" text-anchor="middle" xml:space="preserve">Causes: mode is never read · the keeper is never re-checked · --protect only checks the keeper</text>
</svg>
