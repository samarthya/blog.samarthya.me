<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a startled girl with pink twin tails and a sailor uniform, hands on her cheeks and mouth open, looks up at a ceiling smoke alarm whose 9-volt battery dangles from its wires, while files labelled dry-run fly into a QUARANTINE box and a red badge reads 0 copies left</title>
