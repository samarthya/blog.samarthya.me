    <rect x="600" y="252" width="14" height="58" rx="7" fill="#eab308"/>
    <text x="630" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#1f2937">ClusterRole</text>
    <text x="1142" y="289" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#eab308">cluster-wide</text>
  </g>
  <g filter="url(#drop)">
    <rect x="600" y="320" width="560" height="58" rx="14" fill="#ffffff"/>
    <rect x="600" y="320" width="14" height="58" rx="7" fill="#06b6d4"/>
