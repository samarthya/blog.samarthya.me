    <text x="1045.0" y="517" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="800" fill="#ffffff">permissions add up</text>
  </g>
  <g filter="url(#drop)" transform="rotate(0 765.0 88)">
    <rect x="600" y="66" width="330" height="44" rx="22" fill="#1d4ed8"/>
    <text x="765.0" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">K8s RBAC: who can do what</text>
  </g><defs><linearGradient id="cfur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#c2410c"/></linearGradient><linearGradient id="cbeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="cshine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
  <g filter="url(#drop)" transform="rotate(-30 470 560)"><rect x="400" y="530" width="230" height="64" rx="32" fill="url(#cfur)"/><rect x="430" y="530" width="20" height="64" fill="#1f2937" opacity="0.8"/><rect x="476" y="530" width="20" height="64" fill="#1f2937" opacity="0.8"/><rect x="522" y="530" width="20" height="64" fill="#1f2937" opacity="0.8"/><rect x="568" y="530" width="20" height="64" fill="#1f2937" opacity="0.8"/></g>
