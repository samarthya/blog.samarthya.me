    <text x="1142" y="425" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#a855f7">grants cluster-wide</text>
  </g>
  <g filter="url(#drop)" transform="rotate(0 757.5 510)">
    <rect x="600" y="488" width="315" height="44" rx="22" fill="#1d4ed8"/>
