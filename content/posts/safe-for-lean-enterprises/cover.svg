<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a girl with a purple ponytail holding a flag marked SAFe, beside four configurations: Essential SAFe (start here), Large Solution SAFe (big systems), Portfolio SAFe (strategy), Full SAFe (everything)</title>
  <defs>
