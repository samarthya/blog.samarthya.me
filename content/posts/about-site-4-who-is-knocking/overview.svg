<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Left: Google Analytics, the guest book, sees visitors that run its tag on the blog and the hub, only after the visit, and counted 5,971 users at 1.7 seconds each. Right: the Cloudflare edge, the doorman, sees every request to proxied hosts during the request and sorts it on a bot score from 1 to 99 into automated, likely automated, likely human and verified bots.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.62" r="0.5"><stop offset="0" stop-color="#f97316" stop-opacity="0.16"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="78" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">BUILDING ABOUT.SAMARTHYA.ME · 4</text>
  <text x="60" y="132" fill="#ffffff" font-size="50" font-weight="800">Who is knocking?</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="22">How Cloudflare tells people from bots, and what the free plan gives you.</text>
<g filter="url(#shadow)"><rect x="60" y="205" width="440" height="368" rx="18" fill="url(#card)" stroke="#334155"/></g><rect x="60" y="205" width="440" height="6" rx="3" fill="#a78bfa"/><text x="86" y="250" fill="#ffffff" font-size="21" font-weight="800">Google Analytics · the guest book</text><text x="86" y="290" fill="#e2e8f0" font-size="16.5">✓ runs where the GA tag runs</text><text x="86" y="324" fill="#e2e8f0" font-size="16.5">✓ the blog and the hub</text><text x="86" y="358" fill="#e2e8f0" font-size="16.5">✗ after the visit, can't act</text><text x="86" y="392" fill="#e2e8f0" font-size="16.5">✗ bots without JavaScript: unseen</text><text x="86" y="426" fill="#e2e8f0" font-size="16.5">one country: 5,971 “users”, 1.7 s each</text><rect x="86" y="470" width="388" height="78" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444"/><text x="280" y="502" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="700">Known bots removed; the rest counted</text><text x="280" y="528" text-anchor="middle" fill="#fecaca" font-size="14">engaged sessions fix it afterwards</text><g filter="url(#shadow)"><rect x="540" y="205" width="600" height="368" rx="18" fill="url(#card)" stroke="#334155"/></g><rect x="540" y="205" width="600" height="6" rx="3" fill="#f97316"/><text x="566" y="250" fill="#ffffff" font-size="21" font-weight="800">Cloudflare edge · the doorman</text><text x="566" y="290" fill="#e2e8f0" font-size="16.5">✓ every request to a proxied host</text><text x="566" y="324" fill="#e2e8f0" font-size="16.5">✓ during the request: can challenge</text><text x="566" y="358" fill="#e2e8f0" font-size="16.5">✗ DNS-only hosts (the blog): unseen</text><rect x="566.0" y="430" width="6.0" height="18" rx="5" fill="#ef4444"/><rect x="571.5" y="430" width="153.0" height="18" rx="5" fill="#f97316"/><rect x="726.5" y="430" width="385.5" height="18" rx="5" fill="#22c55e"/><text x="566" y="418" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">bot score 1</text><text x="1114" y="418" text-anchor="end" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">99</text><rect x="566" y="470" width="108" height="28" rx="14" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444"/><text x="620.0" y="489" text-anchor="middle" fill="#ef4444" font-size="12.5" font-weight="700">AUTOMATED</text><rect x="682" y="470" width="150" height="28" rx="14" fill="#f97316" fill-opacity="0.18" stroke="#f97316"/><text x="757.0" y="489" text-anchor="middle" fill="#f97316" font-size="12.5" font-weight="700">LIKELY AUTOMATED</text><rect x="840" y="470" width="122" height="28" rx="14" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e"/><text x="901.0" y="489" text-anchor="middle" fill="#22c55e" font-size="12.5" font-weight="700">LIKELY HUMAN</text><rect x="970" y="470" width="118" height="28" rx="14" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/><text x="1029.0" y="489" text-anchor="middle" fill="#22d3ee" font-size="12.5" font-weight="700">VERIFIED BOT</text><text x="566" y="538" fill="#94a3b8" font-size="14">Free plan: a traffic chart, no bot groups</text><text x="566" y="560" fill="#94a3b8" font-size="14">Pro+: the groups · Enterprise: the score and rules on it</text>
</svg>