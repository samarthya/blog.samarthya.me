<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a green turtle in its shell holds a blue shield with a padlock. Beside it, user mode holds untrusted programs such as bash, nginx, python and vim, and a system call arrow leads down to trusted kernel mode with full access to memory, CPU and I/O</title>
  <defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="0.65" stop-color="#dcfce7"/><stop offset="1" stop-color="#f7fee7"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6d2"/><stop offset="1" stop-color="#fbd1b5"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.6" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#2f7fd6"/><stop offset="1" stop-color="#6fe0e8"/></linearGradient>
<linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa4b5"/><stop offset="0.45" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
<linearGradient id="robot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#b8c4d6"/></linearGradient>
<linearGradient id="qmark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a1d5c" flood-opacity="0.28"/></filter>
<clipPath id="eyeL"><ellipse cx="540" cy="266" rx="38" ry="50"/></clipPath>
<clipPath id="eyeR"><ellipse cx="664" cy="266" rx="38" ry="50"/></clipPath>
<symbol id="spark" viewBox="-10 -10 20 20" overflow="visible"><path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10Z" fill="#ffffff"/></symbol>
</defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <rect x="600" y="150" width="560" height="190" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
    <text x="630" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#1f2937">User mode</text>
    <text x="1130" y="192" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">untrusted · restricted</text>
    <rect x="630" y="220" width="112" height="90" rx="12" fill="#fef3c7"/><text x="686" y="272" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#92400e">bash</text><rect x="758" y="220" width="112" height="90" rx="12" fill="#fef3c7"/><text x="814" y="272" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#92400e">nginx</text><rect x="886" y="220" width="112" height="90" rx="12" fill="#fef3c7"/><text x="942" y="272" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#92400e">python</text><rect x="1014" y="220" width="112" height="90" rx="12" fill="#fef3c7"/><text x="1070" y="272" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#92400e">vim</text>
    <rect x="600" y="400" width="560" height="190" rx="18" fill="#1e293b"/>
    <text x="630" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Kernel mode</text>
    <text x="1130" y="442" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#4ade80">trusted · full access</text>
    <rect x="630" y="470" width="150" height="90" rx="12" fill="#334155"/><text x="705" y="522" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#a5f3fc">memory</text><rect x="800" y="470" width="150" height="90" rx="12" fill="#334155"/><text x="875" y="522" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#a5f3fc">CPU</text><rect x="970" y="470" width="150" height="90" rx="12" fill="#334155"/><text x="1045" y="522" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#a5f3fc">I/O</text>
  </g>
  <defs><marker id="arr7c3aed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker></defs><path d="M880 318 L880 392" stroke="#7c3aed" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr7c3aed)"/>
  <text x="896" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#6d28d9">system call</text>
  <g filter="url(#drop)" transform="rotate(0 759.0 88)">
    <rect x="600" y="66" width="318" height="44" rx="22" fill="#15803d"/>
    <text x="759.0" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Kernel mode vs user mode</text>
  </g><defs><linearGradient id="cfur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bef264"/><stop offset="1" stop-color="#65a30d"/></linearGradient><linearGradient id="cbeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="cshine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
  <g filter="url(#drop)"><ellipse cx="270" cy="520" rx="200" ry="170" fill="#65a30d"/><path d="M270 360 L340 420 L320 510 L220 510 L200 420Z M120 460 L200 420 M420 460 L340 420 M220 510 L170 600 M320 510 L370 600" stroke="#365314" stroke-width="7" fill="none" opacity="0.7"/><ellipse cx="270" cy="520" rx="200" ry="170" fill="none" stroke="#3f6212" stroke-width="10"/></g>
  <ellipse cx="270" cy="530" rx="165" ry="140" fill="url(#cfur)" filter="url(#drop)"/><ellipse cx="270" cy="560" rx="105" ry="100" fill="#fef9c3"/>
  
  <ellipse cx="270" cy="290" rx="165" ry="138" fill="url(#cfur)" filter="url(#drop)"/><ellipse cx="230" cy="190" rx="70" ry="28" fill="url(#cshine)" transform="rotate(-15 230 190)"/>
  
  
  <defs><clipPath id="cL"><ellipse cx="212" cy="290" rx="30" ry="36"/></clipPath><linearGradient id="cLg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14532d"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>
  <ellipse cx="212" cy="290" rx="30" ry="36" fill="#ffffff"/>
  <g clip-path="url(#cL)">
    <ellipse cx="222" cy="288" rx="22.5" ry="27.0" fill="url(#cLg)"/>
    <ellipse cx="222" cy="286" rx="10.125" ry="13.5" fill="#111827"/>
    <circle cx="214.125" cy="277.2" r="7.199999999999999" fill="#ffffff"/>
    <circle cx="229.875" cy="297.45" r="3.0" fill="#ffffff"/>
  </g>
  <ellipse cx="212" cy="290" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <defs><clipPath id="cR"><ellipse cx="328" cy="290" rx="30" ry="36"/></clipPath><linearGradient id="cRg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14532d"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>
  <ellipse cx="328" cy="290" rx="30" ry="36" fill="#ffffff"/>
  <g clip-path="url(#cR)">
    <ellipse cx="338" cy="288" rx="22.5" ry="27.0" fill="url(#cRg)"/>
    <ellipse cx="338" cy="286" rx="10.125" ry="13.5" fill="#111827"/>
    <circle cx="330.125" cy="277.2" r="7.199999999999999" fill="#ffffff"/>
    <circle cx="345.875" cy="297.45" r="3.0" fill="#ffffff"/>
  </g>
  <ellipse cx="328" cy="290" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <ellipse cx="176" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/><ellipse cx="364" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="270" cy="340" rx="17" ry="12" fill="#1f2937"/><ellipse cx="264" cy="335" rx="6" ry="3.5" fill="#ffffff" opacity="0.6"/>
  <path d="M248 366 C258 382 282 382 292 366" stroke="#3f1d0b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  
  <path d="M400 500 C430 470 445 440 450 412" stroke="url(#cfur)" stroke-width="48" fill="none" stroke-linecap="round"/>
  <g filter="url(#drop)"><path d="M460 272 L560 292 C560 372 530 412 510 422 C490 412 460 372 460 272Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="5"/><rect x="492" y="330" width="38" height="30" rx="5" fill="#facc15"/><path d="M499 330 V316 C499 298 523 298 523 316 V330" stroke="#facc15" stroke-width="6" fill="none"/></g>
  <circle cx="450" cy="392" r="28" fill="url(#cfur)" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><ellipse cx="200" cy="520" rx="34" ry="26" fill="url(#cfur)" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><use href="#spark" x="40" y="70" width="24" height="24"/><use href="#spark" x="560" y="40" width="18" height="18"/><use href="#spark" x="1165" y="600" width="22" height="22"/>
</svg>
