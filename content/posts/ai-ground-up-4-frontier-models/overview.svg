<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>What makes a frontier model. Three definitions: capability (state of the art, Frontier Model Forum), compute (top 5 by training compute, Epoch AI) and risk (could pose severe risks, Frontier AI Regulation 2023). A log-scale compute ladder from 10^24 to 10^27 operations: Kimi K2 estimated at about 3 × 10^24, the EU AI Act systemic-risk presumption at 10^25, California SB 53 frontier models at 10^26, with compute growing 4 to 5 times a year. A timeline of 2026 frontier releases: Claude Fable 5.2 on 9 November ($8/$40), Gemini 4 Argon on 30 September ($2/$10 introductory), GPT-6 Astra on 3 September ($10/$50) and Kimi K3 open weights on 16 July (2.7T parameters); launches are gated to cyber defenders and vetted organisations first.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.55"><stop offset="0" stop-color="#d946ef" stop-opacity="0.18"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="rglow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.8"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="70" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">AI FROM THE GROUND UP · 4</text>
  <text x="60" y="120" fill="#ffffff" font-size="46" font-weight="800">What is a frontier model?</text>
  <text x="60" y="156" fill="#cbd5e1" font-size="21">The edge of the map, and where the law draws its lines</text>
<rect x="60" y="186" width="346" height="400" rx="14" fill="url(#card)" stroke="#a78bfa" filter="url(#shadow)"/><text x="78" y="214" fill="#a78bfa" font-size="14" font-weight="800" text-anchor="start">THREE DEFINITIONS</text>
  <rect x="427" y="186" width="346" height="400" rx="14" fill="url(#card)" stroke="#f97316" filter="url(#shadow)"/><text x="445" y="214" fill="#f97316" font-size="14" font-weight="800" text-anchor="start">TRAINING COMPUTE (operations)</text>
  <rect x="794" y="186" width="346" height="400" rx="14" fill="url(#card)" stroke="#22c55e" filter="url(#shadow)"/><text x="812" y="214" fill="#22c55e" font-size="14" font-weight="800" text-anchor="start">THE FRONTIER, NOV 2026</text>
  <rect x="78" y="238" width="310" height="96" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="96" y="270" fill="#ffffff" font-size="19" font-weight="800" text-anchor="start">Capability</text><text x="96" y="296" fill="#ddd6fe" font-size="14" font-weight="600" text-anchor="start">state of the art</text><text x="96" y="318" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Frontier Model Forum</text>
  <rect x="78" y="350" width="310" height="96" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="96" y="382" fill="#ffffff" font-size="19" font-weight="800" text-anchor="start">Compute</text><text x="96" y="408" fill="#ddd6fe" font-size="14" font-weight="600" text-anchor="start">top 5 by training compute</text><text x="96" y="430" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Epoch AI</text>
  <rect x="78" y="462" width="310" height="96" rx="12" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="96" y="494" fill="#ffffff" font-size="19" font-weight="800" text-anchor="start">Risk</text><text x="96" y="520" fill="#ddd6fe" font-size="14" font-weight="600" text-anchor="start">could pose severe risks</text><text x="96" y="542" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Frontier AI Regulation (2023)</text>
  <line x1="497" y1="546" x2="497" y2="246" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="489" y1="546" x2="505" y2="546" stroke="#94a3b8" stroke-width="2"/><text x="483" y="551.0" fill="#cbd5e1" font-size="15" font-weight="700" text-anchor="end">10<tspan baseline-shift='super' font-size='11'>24</tspan></text>
  <line x1="489" y1="449" x2="505" y2="449" stroke="#94a3b8" stroke-width="2"/><text x="483" y="454.33333333333337" fill="#cbd5e1" font-size="15" font-weight="700" text-anchor="end">10<tspan baseline-shift='super' font-size='11'>25</tspan></text>
  <line x1="489" y1="353" x2="505" y2="353" stroke="#94a3b8" stroke-width="2"/><text x="483" y="357.6666666666667" fill="#cbd5e1" font-size="15" font-weight="700" text-anchor="end">10<tspan baseline-shift='super' font-size='11'>26</tspan></text>
  <line x1="489" y1="256" x2="505" y2="256" stroke="#94a3b8" stroke-width="2"/><text x="483" y="261.0" fill="#cbd5e1" font-size="15" font-weight="700" text-anchor="end">10<tspan baseline-shift='super' font-size='11'>27</tspan></text>
  <circle cx="497" cy="500" r="8" fill="#22d3ee"/><line x1="507" y1="500" x2="523" y2="500" stroke="#22d3ee" stroke-width="2"/>
  <text x="529" y="504.59999999999997" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="start">Kimi K2 (2025), my estimate ≈ 3×10²⁴</text>
  <circle cx="497" cy="449" r="8" fill="#f97316"/><line x1="507" y1="449" x2="523" y2="449" stroke="#f97316" stroke-width="2"/>
  <text x="529" y="454.33333333333337" fill="#f97316" font-size="13" font-weight="700" text-anchor="start">EU AI Act: systemic risk</text>
  <circle cx="497" cy="353" r="8" fill="#ef4444"/><line x1="507" y1="353" x2="523" y2="353" stroke="#ef4444" stroke-width="2"/>
  <text x="529" y="357.6666666666667" fill="#ef4444" font-size="13" font-weight="700" text-anchor="start">California SB 53: frontier model</text>
  <rect x="577" y="250" width="176" height="30" rx="15" fill="#f97316" fill-opacity="0.18" stroke="#f97316"/><text x="665" y="270" fill="#fdba74" font-size="13" font-weight="800" text-anchor="middle">growing 4–5× a year</text>
  <line x1="834" y1="252" x2="834" y2="546" stroke="#475569" stroke-width="3"/>
  <circle cx="834" cy="260" r="9" fill="#a78bfa"/><text x="856" y="256" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="start">9 Nov 2026</text>
  <text x="856" y="278" fill="#ffffff" font-size="17" font-weight="800" text-anchor="start">Claude Fable 5.2</text><text x="856" y="300" fill="#a78bfa" font-size="13" font-weight="600" text-anchor="start">Anthropic · $8 / $40</text>
  <circle cx="834" cy="342" r="9" fill="#22d3ee"/><text x="856" y="338" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="start">30 Sep 2026</text>
  <text x="856" y="360" fill="#ffffff" font-size="17" font-weight="800" text-anchor="start">Gemini 4 Argon</text><text x="856" y="382" fill="#22d3ee" font-size="13" font-weight="600" text-anchor="start">Google · $2 / $10 intro</text>
  <circle cx="834" cy="424" r="9" fill="#f97316"/><text x="856" y="420" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="start">3 Sep 2026</text>
  <text x="856" y="442" fill="#ffffff" font-size="17" font-weight="800" text-anchor="start">GPT-6 Astra</text><text x="856" y="464" fill="#f97316" font-size="13" font-weight="600" text-anchor="start">OpenAI · $10 / $50</text>
  <circle cx="834" cy="506" r="9" fill="#22c55e"/><text x="856" y="502" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="start">16 Jul 2026</text>
  <text x="856" y="524" fill="#ffffff" font-size="17" font-weight="800" text-anchor="start">Kimi K3 (open)</text><text x="856" y="546" fill="#22c55e" font-size="13" font-weight="600" text-anchor="start">Moonshot · 2.7T params</text>
  <text x="812" y="574" fill="#86efac" font-size="12" font-weight="600" text-anchor="start">gated first: cyber defenders, vetted orgs</text>
</svg>
