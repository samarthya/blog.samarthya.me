<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>The web UI's request path: a browser request reaches the server correctly bound to 127.0.0.1:8767, then a Host check that only tests startswith('localhost') accepts localhost.evil.example and a missing Host but refuses 127.0.0.1; unknown paths fall through to a file server that returns secret.txt, and POST /save-plan gets 501</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <radialGradient id="glow" cx="0.7" cy="0.6" r="0.5"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
    <filter id="redglow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#ef4444" flood-opacity="0.75"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="56" y="70" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#fca5a5">TESTING CODE AN AI WROTE · 4</text>
  <text x="56" y="124" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">The web UI's front door</text>
  <text x="56" y="160" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Bound to the right address, then open in the wrong ways</text>
<rect x="56" y="210" width="200" height="110" rx="14" fill="#111827" stroke="#334155" stroke-width="2" filter="url(#sh)"/><text x="156" y="252" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">browser</text><text x="156" y="282" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#94a3b8" text-anchor="middle" xml:space="preserve">request</text><path d="M262 265 L308 265" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="316" y="210" width="236" height="110" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2" filter="url(#sh)"/><text x="434" y="248" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#94a3b8" text-anchor="middle" xml:space="preserve">bound to</text><text x="434" y="280" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="800" fill="#bbf7d0" text-anchor="middle" xml:space="preserve">127.0.0.1:8767</text><rect x="384" y="292" width="100" height="28" rx="14" fill="#22c55e"/><text x="434.0" y="311.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">CORRECT</text><path d="M558 265 L604 265" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="612" y="196" width="532" height="290" rx="14" fill="#111827" stroke="#d97706" stroke-width="2" filter="url(#sh)"/><text x="636" y="232" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fde68a" text-anchor="start" xml:space="preserve">Host check:  startswith('localhost')</text><text x="636" y="270" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">localhost:8767</text><text x="948" y="270" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">200</text><rect x="1010" y="250" width="110" height="28" rx="14" fill="#22c55e"/><text x="1065.0" y="269.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">OK</text><text x="636" y="312" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">127.0.0.1:8767</text><text x="948" y="312" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">403</text><rect x="1010" y="292" width="110" height="28" rx="14" fill="#f97316"/><text x="1065.0" y="311.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">BROKEN</text><text x="636" y="354" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">localhost.evil.example</text><text x="948" y="354" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">200</text><rect x="1010" y="334" width="110" height="28" rx="14" fill="#ef4444"/><text x="1065.0" y="353.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">UNSAFE</text><text x="636" y="396" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">(no Host header)</text><text x="948" y="396" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">200</text><rect x="1010" y="376" width="110" height="28" rx="14" fill="#ef4444"/><text x="1065.0" y="395.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">UNSAFE</text><text x="636" y="438" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">evil.example</text><text x="948" y="438" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start" xml:space="preserve">403</text><rect x="1010" y="418" width="110" height="28" rx="14" fill="#22c55e"/><text x="1065.0" y="437.5" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">OK</text><rect x="56" y="360" width="496" height="214" rx="14" fill="#111827" stroke="#334155" stroke-width="2" filter="url(#sh)"/><text x="80" y="396" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#94a3b8" text-anchor="start" xml:space="preserve">Routes (do_GET only)</text><text x="80" y="434" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">GET /</text><text x="290" y="434" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#22c55e" text-anchor="start" xml:space="preserve">page</text><text x="80" y="470" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">GET /report.json</text><text x="290" y="470" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#22c55e" text-anchor="start" xml:space="preserve">report</text><text x="80" y="506" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">anything else</text><text x="290" y="506" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ef4444" text-anchor="start" xml:space="preserve">→ files in the start folder</text><text x="80" y="542" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="start" xml:space="preserve">POST /save-plan</text><text x="290" y="542" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ef4444" text-anchor="start" xml:space="preserve">→ 501 Unsupported method</text><rect x="612" y="504" width="532" height="70" rx="14" fill="#450a0a" stroke="#ef4444" stroke-width="2" filter="url(#redglow)"/><text x="878" y="547" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="800" fill="#fecaca" text-anchor="middle" xml:space="preserve">GET /secret.txt  →  200, contents served</text>
</svg>
