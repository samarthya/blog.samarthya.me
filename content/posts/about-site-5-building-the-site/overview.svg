<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Left: the build in four steps: a pre-render script writes 18 fragments, Quarto renders six pages with light and dark themes, a post-render step swaps the 180 KB icon font for inline SVG, leaving 30 static files. Right: the home page is 208 KB compressed, the stats page with 18 SVG charts 43 KB, no icon font, no charting library, 1.8 MB on disk.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.62" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><rect width="1200" height="630" fill="url(#glow)"/>
  <text x="60" y="78" fill="#fca5a5" font-size="18" font-weight="700" letter-spacing="3">BUILDING ABOUT.SAMARTHYA.ME · 5</text>
  <text x="60" y="132" fill="#ffffff" font-size="50" font-weight="800">A small, fast site in Quarto</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="22">Python fills the pages, Quarto lays them out, nothing runs on the server.</text>
<line x1="94" y1="277" x2="94" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><line x1="94" y1="369" x2="94" y2="387" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><line x1="94" y1="461" x2="94" y2="479" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><g filter="url(#shadow)"><rect x="60" y="205" width="530" height="72" rx="14" fill="url(#card)" stroke="#334155"/></g>
  <circle cx="94" cy="241" r="16" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa"/><text x="94" y="247" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="800">1</text>
  <text x="124" y="236" fill="#ffffff" font-size="19" font-weight="700">Pre-render: build_data.py</text>
  <text x="124" y="260" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">feeds · GA4 · GitHub → 18 fragments</text>
  
  <g filter="url(#shadow)"><rect x="60" y="297" width="530" height="72" rx="14" fill="url(#card)" stroke="#334155"/></g>
  <circle cx="94" cy="333" r="16" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa"/><text x="94" y="339" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="800">2</text>
  <text x="124" y="328" fill="#ffffff" font-size="19" font-weight="700">quarto render</text>
  <text x="124" y="352" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">6 pages · journal / darkly · side menu</text>
  <rect x="458" y="319" width="120" height="28" rx="14" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/><text x="518.0" y="338" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">LIGHT + DARK</text>
  <g filter="url(#shadow)"><rect x="60" y="389" width="530" height="72" rx="14" fill="url(#card)" stroke="#334155"/></g>
  <circle cx="94" cy="425" r="16" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa"/><text x="94" y="431" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="800">3</text>
  <text x="124" y="420" fill="#ffffff" font-size="19" font-weight="700">Post-render: post_render.py</text>
  <text x="124" y="444" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">&lt;i class=bi&gt; → inline SVG</text>
  <rect x="494" y="411" width="84" height="28" rx="14" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e"/><text x="536.0" y="430" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">−180 KB</text>
  <g filter="url(#shadow)"><rect x="60" y="481" width="530" height="72" rx="14" fill="url(#card)" stroke="#334155"/></g>
  <circle cx="94" cy="517" r="16" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa"/><text x="94" y="523" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="800">4</text>
  <text x="124" y="512" fill="#ffffff" font-size="19" font-weight="700">_site/</text>
  <text x="124" y="536" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">static files only</text>
  <rect x="488" y="503" width="90" height="28" rx="14" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/><text x="533.0" y="522" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">30 FILES</text>
  <g filter="url(#shadow)"><rect x="650" y="205" width="490" height="368" rx="18" fill="url(#card)" stroke="#334155"/></g><text x="676" y="242" fill="#ffffff" font-size="19" font-weight="700">How small is small?</text><text x="676" y="286" fill="#e2e8f0" font-size="17">Home page, compressed</text><text x="1116" y="287" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="800">208 KB</text><line x1="676" y1="309" x2="1116" y2="309" stroke="#334155"/><text x="676" y="344" fill="#e2e8f0" font-size="17">Stats page, 18 SVG charts</text><text x="1116" y="345" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="800">43 KB</text><line x1="676" y1="367" x2="1116" y2="367" stroke="#334155"/><text x="676" y="402" fill="#e2e8f0" font-size="17">Icon font</text><text x="1116" y="403" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="800">0 KB</text><line x1="676" y1="425" x2="1116" y2="425" stroke="#334155"/><text x="676" y="460" fill="#e2e8f0" font-size="17">Charting library</text><text x="1116" y="461" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="800">none</text><line x1="676" y1="483" x2="1116" y2="483" stroke="#334155"/><text x="676" y="518" fill="#e2e8f0" font-size="17">Whole site on disk</text><text x="1116" y="519" text-anchor="end" fill="#67e8f9" font-size="20" font-weight="800">1.8 MB</text>
</svg>