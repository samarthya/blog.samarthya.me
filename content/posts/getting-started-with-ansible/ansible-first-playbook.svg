<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Ansible control flow</title>
  <desc id="desc">A control node reads an inventory and playbook, then connects to a managed host.</desc>
  <rect width="900" height="250" rx="18" fill="#fff7ed"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="45" y="75" width="190" height="100" rx="14" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
    <text x="140" y="115" font-size="21" font-weight="700" fill="#7c2d12">Inventory</text><text x="140" y="145" font-size="15" fill="#7c2d12">who to manage</text>
    <rect x="355" y="75" width="190" height="100" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <text x="450" y="115" font-size="21" font-weight="700" fill="#7c2d12">Playbook</text><text x="450" y="145" font-size="15" fill="#7c2d12">desired state</text>
    <rect x="665" y="75" width="190" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="760" y="115" font-size="21" font-weight="700" fill="#14532d">Managed host</text><text x="760" y="145" font-size="15" fill="#14532d">SSH + modules</text>
    <path d="M240 125h105M550 125h105" stroke="#9a3412" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#9a3412"/></marker></defs>
</svg>
