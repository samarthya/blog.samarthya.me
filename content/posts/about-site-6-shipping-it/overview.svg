  <text x="124" y="512" fill="#ffffff" font-size="19" font-weight="700">verify.py</text>
  <text x="124" y="536" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">SHA-256 from the origin + edge checks</text>
