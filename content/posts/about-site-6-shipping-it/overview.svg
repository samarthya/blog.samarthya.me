  <text x="124" y="352" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">AUTH TLS · PROT P · session reuse</text>
  <rect x="494" y="319" width="84" height="28" rx="14" fill="#f97316" fill-opacity="0.18" stroke="#f97316"/><text x="536.0" y="338" text-anchor="middle" fill="#f97316" font-size="13" font-weight="700">MIRROR</text>
  <g filter="url(#shadow)"><rect x="60" y="389" width="530" height="72" rx="14" fill="url(#card)" stroke="#334155"/></g>
  <circle cx="94" cy="425" r="16" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa"/><text x="94" y="431" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="800">3</text>
  <text x="124" y="420" fill="#ffffff" font-size="19" font-weight="700">.htaccess last</text>
  <text x="124" y="444" fill="#94a3b8" font-size="14" font-family="Consolas, Menlo, monospace">no scripts · CSP · cache times</text>
