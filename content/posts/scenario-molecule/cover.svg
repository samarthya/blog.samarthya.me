    <circle cx="216.125" cy="198.2" r="7.199999999999999" fill="#ffffff"/>
    <circle cx="231.875" cy="218.45" r="3.0" fill="#ffffff"/>
  </g>
  <ellipse cx="212" cy="205" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <defs><clipPath id="cR"><ellipse cx="328" cy="205" rx="30" ry="36"/></clipPath><linearGradient id="cRg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#713f12"/><stop offset="1" stop-color="#facc15"/></linearGradient></defs>
  <ellipse cx="328" cy="205" rx="30" ry="36" fill="#ffffff"/>
  <g clip-path="url(#cR)">
    <ellipse cx="340" cy="209" rx="22.5" ry="27.0" fill="url(#cRg)"/>
    <ellipse cx="340" cy="207" rx="10.125" ry="13.5" fill="#111827"/>
    <circle cx="332.125" cy="198.2" r="7.199999999999999" fill="#ffffff"/>
    <circle cx="347.875" cy="218.45" r="3.0" fill="#ffffff"/>
  </g>
  <ellipse cx="328" cy="205" rx="30" ry="36" fill="none" stroke="#1f2937" stroke-width="4"/>
  <ellipse cx="176" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/><ellipse cx="364" cy="356" rx="22" ry="10" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
  <path d="M238 362 C250 396 290 396 302 362Z" fill="#be123c"/><path d="M244 366 L296 366" stroke="#ffffff" stroke-width="6"/>
  
  <path d="M400 500 C430 470 445 440 450 412" stroke="url(#cfur)" stroke-width="48" fill="none" stroke-linecap="round"/>
  <g filter="url(#drop)"><path d="M460 242 L500 242 L500 292 L540 372 C546 386 536 396 522 396 L438 396 C424 396 414 386 420 372 L460 292Z" fill="#ecfeff" stroke="#0e7490" stroke-width="4"/><path d="M432 352 L528 352 L538 372 C542 384 534 392 522 392 L438 392 C426 392 418 384 422 372Z" fill="#a3e635"/><circle cx="470" cy="332" r="8" fill="#d9f99d"/><circle cx="490" cy="308" r="6" fill="#d9f99d"/><circle cx="478" cy="272" r="5" fill="#d9f99d"/></g>
  <circle cx="450" cy="392" r="28" fill="url(#cfur)" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><ellipse cx="200" cy="520" rx="34" ry="26" fill="url(#cfur)" stroke="#000000" stroke-opacity="0.2" stroke-width="3"/><use href="#spark" x="40" y="70" width="24" height="24"/><use href="#spark" x="560" y="40" width="18" height="18"/><use href="#spark" x="1165" y="600" width="22" height="22"/>
