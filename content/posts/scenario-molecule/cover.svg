<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a green frog scientist in lab goggles holds a bubbling flask, beside a terminal running molecule init scenario check_python_installed -d docker and the tree it creates: converge.yml, molecule.yml, verify.yml</title>
  <defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="0.65" stop-color="#cffafe"/><stop offset="1" stop-color="#f7fee7"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6d2"/><stop offset="1" stop-color="#fbd1b5"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.6" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#2f7fd6"/><stop offset="1" stop-color="#6fe0e8"/></linearGradient>
<linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa4b5"/><stop offset="0.45" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
<linearGradient id="robot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#b8c4d6"/></linearGradient>
<linearGradient id="qmark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a1d5c" flood-opacity="0.28"/></filter>
<clipPath id="eyeL"><ellipse cx="540" cy="266" rx="38" ry="50"/></clipPath>
<clipPath id="eyeR"><ellipse cx="664" cy="266" rx="38" ry="50"/></clipPath>
<symbol id="spark" viewBox="-10 -10 20 20" overflow="visible"><path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10Z" fill="#ffffff"/></symbol>
</defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <rect x="600" y="150" width="560" height="309" rx="18" fill="#0f172a"/>
    <path d="M600 200 V168 Q600 150 618 150 H1142 Q1160 150 1160 168 V200Z" fill="#1e293b"/>
    <circle cx="628" cy="175" r="7" fill="#ef4444"/><circle cx="650" cy="175" r="7" fill="#f59e0b"/><circle cx="672" cy="175" r="7" fill="#22c55e"/>
    <text x="880.0" y="182" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#94a3b8">molecule</text>
  </g>
  <text xml:space="preserve" x="626" y="242" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">molecule init scenario \</tspan></text><text xml:space="preserve" x="626" y="273" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0">    check_python_installed -d docker</text><text xml:space="preserve" x="626" y="304" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700"><tspan fill="#4ade80">$ </tspan><tspan fill="#f8fafc">tree molecule/check_python_installed</tspan></text><text xml:space="preserve" x="626" y="335" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#e2e8f0">molecule/check_python_installed</text><text xml:space="preserve" x="626" y="366" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#4ade80">├── converge.yml</text><text xml:space="preserve" x="626" y="397" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#4ade80">├── molecule.yml</text><text xml:space="preserve" x="626" y="428" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#4ade80">└── verify.yml</text>
  <g filter="url(#drop)" transform="rotate(0 741.0 88)">
    <rect x="600" y="66" width="282" height="44" rx="22" fill="#0e7490"/>
    <text x="741.0" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Molecule: test a role</text>
  </g><defs><linearGradient id="cfur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient><linearGradient id="cbeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient><linearGradient id="cshine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
  <ellipse cx="270" cy="530" rx="165" ry="140" fill="url(#cfur)" filter="url(#drop)"/><ellipse cx="270" cy="560" rx="105" ry="100" fill="#ecfccb"/>
  <circle cx="200" cy="200" r="62" fill="url(#cfur)"/><circle cx="340" cy="200" r="62" fill="url(#cfur)"/>
  <ellipse cx="270" cy="290" rx="165" ry="138" fill="url(#cfur)" filter="url(#drop)"/><ellipse cx="230" cy="190" rx="70" ry="28" fill="url(#cshine)" transform="rotate(-15 230 190)"/>
  
  
  <defs><clipPath id="cL"><ellipse cx="212" cy="205" rx="30" ry="36"/></clipPath><linearGradient id="cLg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#713f12"/><stop offset="1" stop-color="#facc15"/></linearGradient></defs>
  <ellipse cx="212" cy="205" rx="30" ry="36" fill="#ffffff"/>
