<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><title>How the code was made: from a desktop terminal over SSH to a Linux server, where generate.py sends one streaming HTTP request to Colibri on 127.0.0.1:8010 and writes the reply to raw.md; a redrawn terminal shows the health check, the nohup command and the log</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity="0.07"/></pattern>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
</defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/><text x="40" y="52" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3" fill="#fca5a5">TESTING CODE AN AI WROTE · 1</text><text x="40" y="104" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#fff">How the code was made</text><text x="40" y="138" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">One prompt, one HTTP request, four hours of streaming, all on the server.</text><rect x="40" y="172" width="230" height="150" rx="14" fill="#111827" stroke="#334155" filter="url(#sh)"/><text x="60" y="204" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="start" xml:space="preserve">My desktop</text><text x="60" y="232" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve">Windows, a terminal</text><text x="60" y="262" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#22d3ee" text-anchor="start" xml:space="preserve">ssh me@server</text><text x="60" y="296" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">only watches; can sleep</text><line x1="276" y1="247" x2="366" y2="247" stroke="#22d3ee" stroke-width="3" marker-end="url(#ar)"/><text x="321" y="236" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="middle" xml:space="preserve">SSH</text><rect x="372" y="166" width="788" height="162" rx="16" fill="#0f172a" stroke="#334155" filter="url(#sh)"/><text x="392" y="192" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">Linux server on my network  ·  CPU only, 31 GB RAM</text><rect x="392" y="206" width="250" height="106" rx="12" fill="#1f2937" stroke="#475569"/><text x="410" y="236" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fff" text-anchor="start" xml:space="preserve">generate.py</text><text x="410" y="262" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve">sends PROMPT.md once</text><text x="410" y="284" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve">writes raw.md as it arrives</text><text x="410" y="304" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">run with nohup</text><rect x="890" y="206" width="250" height="106" rx="12" fill="#1f2937" stroke="#475569"/><text x="908" y="236" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#fff" text-anchor="start" xml:space="preserve">coli serve</text><text x="908" y="262" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve">Colibri 2.1, 127.0.0.1:8010</text><text x="908" y="284" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="start" xml:space="preserve">Qwen3-Coder 30B, int4</text><text x="908" y="304" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">context 40,960 tokens</text><line x1="648" y1="238" x2="882" y2="238" stroke="#22d3ee" stroke-width="3" marker-end="url(#ar)"/><text x="765" y="228" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#22d3ee" text-anchor="middle" xml:space="preserve">POST /v1/chat/completions</text><line x1="882" y1="282" x2="648" y2="282" stroke="#a78bfa" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ag)"/><text x="765" y="302" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#a78bfa" text-anchor="middle" xml:space="preserve">streamed pieces, ~1.4 a second</text><rect x="40" y="352" width="1120" height="250" rx="14" fill="#020617" stroke="#334155" filter="url(#sh)"/><rect x="40" y="352" width="1120" height="34" rx="14" fill="#1e293b"/><rect x="40" y="372" width="1120" height="14" fill="#1e293b"/><circle cx="64" cy="369" r="6" fill="#ef4444"/><circle cx="86" cy="369" r="6" fill="#f59e0b"/><circle cx="108" cy="369" r="6" fill="#22c55e"/><text x="600" y="375" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" xml:space="preserve">me@server: ~/dupfind-llm-bench   (redrawn; log lines copied from the run)</text><text x="60" y="412" font-family="Consolas, Menlo, monospace" font-size="15" xml:space="preserve"><tspan fill="#22c55e">$ </tspan><tspan fill="#e2e8f0">curl -s 127.0.0.1:8010/health | grep -o '"context_tokens":[0-9]*'</tspan></text><text x="60" y="433" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">"context_tokens":40960</text><text x="60" y="454" font-family="Consolas, Menlo, monospace" font-size="15" xml:space="preserve"><tspan fill="#22c55e">$ </tspan><tspan fill="#e2e8f0">nohup python3 tools/generate.py colibri --url http://127.0.0.1:8010 &gt; runs-colibri.log 2&gt;&amp;1 &amp;</tspan></text><text x="60" y="475" font-family="Consolas, Menlo, monospace" font-size="15" xml:space="preserve"><tspan fill="#22c55e">$ </tspan><tspan fill="#e2e8f0">tail -f runs-colibri.log</tspan></text><text x="60" y="496" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">colibri: preflight</text><text x="60" y="517" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">  colibri: status ok, context 40960, busy 0, RAM free 16.19 GB</text><text x="60" y="538" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#fbbf24" text-anchor="start" xml:space="preserve">  first token after 251 s</text><text x="60" y="559" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" xml:space="preserve">  1000 pieces, 531 s        ...        10000 pieces, 5157 s        ...</text><text x="60" y="580" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#fbbf24" text-anchor="start" xml:space="preserve">  20000 pieces, 14553 s</text></svg>