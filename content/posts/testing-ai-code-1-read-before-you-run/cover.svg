<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Anime illustration: a ginger detective cat in a checked deerstalker, one eye narrowed in suspicion, holds a magnifying glass over a page of generated code where the lines that delete or move files are highlighted in red; a thought bubble asks who calls os.remove?</title>
  <defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="0.65" stop-color="#c4b5fd"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6d2"/><stop offset="1" stop-color="#fbd1b5"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.6" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#2f7fd6"/><stop offset="1" stop-color="#6fe0e8"/></linearGradient>
<linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa4b5"/><stop offset="0.45" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
<linearGradient id="robot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#b8c4d6"/></linearGradient>
<linearGradient id="qmark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a1d5c" flood-opacity="0.28"/></filter>
<clipPath id="eyeL"><ellipse cx="540" cy="266" rx="38" ry="50"/></clipPath>
<clipPath id="eyeR"><ellipse cx="664" cy="266" rx="38" ry="50"/></clipPath>
<symbol id="spark" viewBox="-10 -10 20 20" overflow="visible"><path d="M0 -10 Q1.2 -1.2 10 0 Q1.2 1.2 0 10 Q-1.2 1.2 -10 0 Q-1.2 -1.2 0 -10Z" fill="#ffffff"/></symbol>
</defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g filter="url(#drop)" transform="rotate(-3 260 350)">
    <rect x="40" y="110" width="440" height="470" rx="16" fill="#ffffff"/>
    <rect x="40" y="110" width="440" height="34" rx="16" fill="#e2e8f0"/><rect x="40" y="128" width="440" height="16" fill="#e2e8f0"/>
    <circle cx="64" cy="127" r="6" fill="#ef4444"/><circle cx="84" cy="127" r="6" fill="#f59e0b"/><circle cx="104" cy="127" r="6" fill="#22c55e"/>
    <text x="130" y="133" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#334155">cleaner.py</text>
    <text xml:space="preserve" x="74" y="170" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#475569">def perform_action(</text><text xml:space="preserve" x="74" y="202" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#475569">    if action == 'recycle':</text><rect x="62" y="212" width="392" height="30" rx="6" fill="#fee2e2"/><text xml:space="preserve" x="74" y="234" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#ef4444">        send2trash(file_path)</text><text xml:space="preserve" x="74" y="266" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#475569">    elif action == 'quarantine':</text><rect x="62" y="276" width="392" height="30" rx="6" fill="#fee2e2"/><text xml:space="preserve" x="74" y="298" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#ef4444">        shutil.move(file_path, dest)</text><text xml:space="preserve" x="74" y="330" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#475569">    elif action == 'delete':</text><rect x="62" y="340" width="392" height="30" rx="6" fill="#fee2e2"/><text xml:space="preserve" x="74" y="362" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#ef4444">        os.remove(file_path)</text><text xml:space="preserve" x="74" y="426" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#475569">def restore(log_file):</text><rect x="62" y="436" width="392" height="30" rx="6" fill="#fee2e2"/><text xml:space="preserve" x="74" y="458" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#ef4444">    shutil.move(new, original)</text><text xml:space="preserve" x="74" y="522" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#475569">def scan(paths):</text><text xml:space="preserve" x="74" y="554" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700" fill="#475569">    # only reads files</text>
  </g>
  <defs><linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="tweed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a16207"/><stop offset="1" stop-color="#713f12"/></linearGradient>
    <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="url(#tweed)"/>
      <path d="M0 8 H16 M8 0 V16" stroke="#fde68a" stroke-width="1.5" opacity="0.45"/></pattern></defs>
  <!-- tail -->
  <path d="M880 560 C990 560 1060 480 1030 380 C1020 350 1060 330 1070 360 C1100 470 1030 600 880 600Z" fill="url(#fur)" filter="url(#drop)"/>
  <path d="M1036 372 C1030 352 1058 336 1068 358 L1060 380Z" fill="#7c2d12" opacity="0.5"/>
  <!-- body -->
  <ellipse cx="780" cy="520" rx="160" ry="135" fill="url(#fur)" filter="url(#drop)"/>
  <ellipse cx="780" cy="545" rx="86" ry="96" fill="#fff7ed"/>
  <path d="M700 420 C690 440 692 470 700 490 M860 420 C870 440 868 470 860 490" stroke="#9a3412" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- ears -->
  <path d="M640 250 L652 120 L740 200Z" fill="url(#fur)"/><path d="M660 225 L666 152 L716 200Z" fill="#fda4af"/>
  <path d="M920 250 L908 120 L820 200Z" fill="url(#fur)"/><path d="M900 225 L894 152 L844 200Z" fill="#fda4af"/>
  <!-- head -->
  <ellipse cx="780" cy="310" rx="160" ry="128" fill="url(#fur)" filter="url(#drop)"/>
  <path d="M700 250 C710 262 712 276 708 290 M780 236 L780 270 M860 250 C850 262 848 276 852 290" stroke="#9a3412" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="780" cy="380" rx="72" ry="44" fill="#fff7ed"/>
  <!-- deerstalker -->
  <path d="M672 222 C676 136 884 136 888 222Z" fill="url(#check)" filter="url(#drop)"/>
  <path d="M640 228 C700 206 860 206 920 228 C900 246 660 246 640 228Z" fill="#713f12"/>
  <path d="M760 146 C770 128 790 128 800 146" stroke="#713f12" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- eyes: one wide, one narrowed in suspicion -->
  
  <defs><clipPath id="catL"><ellipse cx="722" cy="320" rx="36" ry="42"/></clipPath><linearGradient id="catLg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#065f46"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs>
  <ellipse cx="722" cy="320" rx="36" ry="42" fill="#ffffff"/>
  <g clip-path="url(#catL)">
    <ellipse cx="712" cy="324" rx="27.0" ry="31.5" fill="url(#catLg)"/>
    <ellipse cx="712" cy="322" rx="12.15" ry="15.75" fill="#111827"/>
    <circle cx="702.55" cy="311.4" r="7.92" fill="#ffffff"/>
    <circle cx="721.45" cy="335.025" r="3.6" fill="#ffffff"/>
  </g>
  <ellipse cx="722" cy="320" rx="36" ry="42" fill="none" stroke="#1f2937" stroke-width="4"/>
  <path d="M680 270 C700 262 740 262 760 272" stroke="#7c2d12" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M800 326 C818 312 852 312 870 324" stroke="#1f2937" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M806 330 C826 340 850 340 866 330" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="836" cy="334" rx="11" ry="5" fill="#16a34a"/>
  <path d="M798 300 C820 286 852 288 876 302" stroke="#7c2d12" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- nose, mouth, whiskers -->
  <path d="M770 366 L790 366 L780 378Z" fill="#f472b6"/>
  <path d="M780 378 C778 392 764 396 756 388 M780 378 C782 392 796 396 804 388" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M700 380 L620 368 M702 394 L622 402 M860 380 L940 368 M858 394 L938 402" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
  <!-- arm and magnifier -->
  <path d="M680 470 C620 500 560 500 520 470" stroke="url(#fur)" stroke-width="54" fill="none" stroke-linecap="round"/>
  <g filter="url(#drop)">
    <path d="M318 430 L500 470" stroke="#7c4a24" stroke-width="24" stroke-linecap="round"/>
    <circle cx="250" cy="372" r="98" fill="#e0f2fe" fill-opacity="0.5" stroke="#f59e0b" stroke-width="20"/>
    <circle cx="250" cy="372" r="98" fill="none" stroke="#b45309" stroke-width="5"/>
    <text x="250" y="386" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="800" font-size="31" fill="#dc2626">os.remove</text>
    <path d="M190 322 C204 300 228 290 252 288" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
  <circle cx="512" cy="470" r="34" fill="url(#fur)" stroke="#9a3412" stroke-width="3"/>
  <path d="M500 448 L500 462 M516 446 L516 462" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#drop)" fill="#ffffff">
    <ellipse cx="1040" cy="150" rx="120" ry="70"/><circle cx="956" cy="126" r="42"/><circle cx="1016" cy="101" r="43"/><circle cx="1082" cy="104" r="42"/><circle cx="1130" cy="132" r="38"/><circle cx="1124" cy="178" r="35"/><circle cx="1052" cy="196" r="38"/><circle cx="968" cy="182" r="35"/>
    <circle cx="985" cy="223" r="13"/><circle cx="930" cy="240" r="8"/>
  </g>
  <text x="1040" y="140" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-weight="700" font-size="25" fill="#334155">who calls</text>
  <text x="1040" y="176" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="800" font-size="25" fill="#dc2626">os.remove?</text><use href="#spark" x="1150" y="330" width="24" height="24"/><use href="#spark" x="560" y="80" width="22" height="22"/><use href="#spark" x="600" y="600" width="18" height="18"/><use href="#spark" x="1160" y="560" width="20" height="20"/>
</svg>
